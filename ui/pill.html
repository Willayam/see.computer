<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* The chip and its notices hold the bottom edge, where they sit in the
     260x48 window, so they stay put in the larger window previews rest at. */
  /* Width and offset come from JS (CV_W in the preview section): the capsule
     grows to MAX_W and the canvas holds that plus a margin for the shadow. */
  #cv { position: fixed; left: 50%; bottom: 0; height: 48px; }
  #pill {
    position: fixed; left: 50%; top: calc(100% - 24px); transform: translate(-50%, -50%) translateY(4px);
    padding: 8px 14px; border-radius: 999px; color: #fff; font: 500 13px/1 -apple-system, system-ui;
    background: rgba(20,20,22,.92); opacity: 0; transition: opacity .12s ease-out, transform .12s ease-out;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #pill.on { opacity: 1; transform: translate(-50%, -50%); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #5ac8fa; }
  .preparing #dot { background: #5ac8fa; animation: pulse .6s infinite; }
  .error { background: rgba(120,30,30,.94); }
  @keyframes pulse { 50% { opacity: .3; } }
  /* ---- the card the chip stretches into when nothing could take the words ---- */
  #card {
    /* No universal reset in this file, so the width set from JS must include
       the padding or the card outgrows the window that was sized for it. */
    box-sizing: border-box;
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; height: 40px; padding: 0 10px 0 13px;
    border-radius: 20px; white-space: nowrap; opacity: 0; pointer-events: none;
    background: rgba(22,22,25,.95); color: #fff;
    font: 400 13px/1.35 -apple-system, system-ui, "SF Pro Text", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.16), inset 0 .5px 0 rgba(255,255,255,.10),
                0 14px 38px rgba(0,0,0,.44), 0 2px 8px rgba(0,0,0,.28);
    overflow: hidden;
    transition: width .34s cubic-bezier(.2,.9,.3,1), opacity .14s ease-out;
    /* no transform transition: the width is what animates, the scale would fight it */
  }
  #card.on { opacity: 1; pointer-events: auto; }
  #card.measuring { opacity: 0; transition: none; transform: translate(-50%, -50%); }
  /* Held at the width they will end at, so the stretch reveals them rather
     than reflowing them line by line. */
  #card .row { display: flex; align-items: center; flex: 0 0 auto; }
  .cglyph { display: flex; align-items: center; gap: 2px; height: 15px; flex: 0 0 auto; margin-right: 10px;
            color: #5ac8fa; }
  .cglyph i { width: 2.5px; border-radius: 2px; background: currentColor;
              box-shadow: 0 0 5px rgba(90,200,250,.55); }
  /* Heights live here, not in a style attribute: Tauri's CSP carries a nonce,
     which makes 'unsafe-inline' inert, so attribute styles never apply. */
  .cglyph i.b1 { height: 6px; }
  .cglyph i.b2 { height: 11px; }
  .cglyph i.b3 { height: 15px; }
  .cglyph i.b4 { height: 9px; }
  .cglyph i.b5 { height: 5px; }
  .cglyph svg.book { width: 15px; height: 15px; }
  .cglyph svg { width: 16px; height: 12.5px; display: block;
                filter: drop-shadow(0 0 5px rgba(90,200,250,.5)); }
  #cnote { flex: 0 0 auto; margin-right: 9px; padding: 2px 6px; border-radius: 5px;
           background: rgba(255,255,255,.09); color: rgba(255,255,255,.72);
           font: 590 10.5px -apple-system, system-ui, Helvetica, sans-serif;
           font-variant-numeric: tabular-nums; }
  #cnote:empty { display: none; }
  #csaid { flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis;
           letter-spacing: -.003em; color: rgba(255,255,255,.94); }
  #ccopy { flex: 0 0 auto; margin-left: 12px; height: 26px; padding: 0 11px; border: 0; border-radius: 7px;
           background: rgba(255,255,255,.10); color: rgba(255,255,255,.95);
           font: 590 12px -apple-system, system-ui, Helvetica, sans-serif; letter-spacing: -.005em;
           cursor: pointer; transition: background .12s ease-out; }
  #ccopy:hover { background: rgba(255,255,255,.17); }
  #ccopy:active { background: rgba(255,255,255,.24); }
  #ccopy.done { background: rgba(52,199,89,.22); color: #7ee2a0; }
  #crule { flex: 0 0 auto; width: 1px; height: 16px; margin: 0 4px 0 8px; background: rgba(255,255,255,.13); }
  #cx { flex: 0 0 auto; width: 24px; height: 24px; border: 0; background: none; padding: 0;
        display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px;
        color: rgba(255,255,255,.38); transition: color .12s ease-out, background .12s ease-out; }
  #cx:hover { color: rgba(255,255,255,.92); background: rgba(255,255,255,.10); }
  #cx svg { width: 9px; height: 9px; }
  body.carded #cv, body.carded #pill, body.carded #iwrap { display: none; }
  /* ---- the words so far: inside the chip, to the right of the bars ---- */
  /* The canvas draws the capsule; this is only the text, laid over the canvas's
     exact rectangle (width and offset set from JS, from CV_W), so an x in the
     canvas is the same x here. No background of its own, so there is never a
     second shape. placeWords() writes the mask that clips the text at the
     capsule's edges and the line's position, each frame the capsule moves.
     Opacity follows the chip's own fade. */
  #iwrap { position: fixed; left: 50%; bottom: 11px; height: 24px; opacity: 0; pointer-events: none; }
  #iclip { position: absolute; inset: 0; overflow: hidden; }
  /* Anchored at the right, because once the line is full its right end is
     what stays put. placeWords() moves it with a transform; words arrive with a Web Animation (blurIn), not a CSS rule, so
     the blur and its timing live with the other tunables. */
  #iline { position: absolute; right: 0; top: 0; white-space: nowrap; will-change: transform;
           font: 400 12px/24px -apple-system, system-ui, "SF Pro Text", Helvetica, sans-serif;
           letter-spacing: -.003em; -webkit-font-smoothing: antialiased;
           color: rgba(255,255,255,.5); transition: color .25s ease-out; }
  #iclip.isettled #iline { color: rgba(255,255,255,.36); }
</style>

  <button id="cx" aria-label="Dismiss"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round"><path d="M1.4 1.4l7.2 7.2M8.6 1.4L1.4 8.6"/></svg></button>

/* ---------- state from the backend ---------- */

let activity = null;         // last Show payload, to restore after a flash
let hideTimer;

   draws like 'listen', and only the ring tells them apart. */
const taking = s => s === 'listen' || s === 'record' || s === 'lock';
const preparing = { downloading: 'Downloading model', loading: 'Loading model', warming: 'Warming up' };
const pillEl = document.getElementById('pill'), textEl = document.getElementById('text');
function showText(cls, msg) { pillEl.className = 'on ' + cls; textEl.textContent = msg; }
function clearText() { pillEl.className = ''; notice = null; }
function applyActivity(p) {
  cv.setAttribute('aria-label', p.activity === 'recording-locked'
    ? 'Video and narration locked. Tap your dictation key to stop.'
    : p.activity === 'locked' ? 'Dictation locked.' : p.activity);
  if (p.activity === 'preparing') {
    st = 'hidden';
    notice = true;
    showText('preparing', preparing[p.phase] + (p.phase === 'downloading' && p.pct != null ? ' ' + p.pct + '%' : ''));
    return;

/* ---------- the card: shown when a dictation had nowhere to land ---------- */

   itself first, the window grows to exactly that, and only then does it fade
   in. Growing after would clip it; guessing a width would waste screen. */
const ICON_VIDEO = '<svg viewBox="0 0 18 14" fill="currentColor"><path d="M2.4 1.2h6.4a2.2 2.2 0 0 1 2.2 2.2v7.2a2.2 2.2 0 0 1-2.2 2.2H2.4A2.2 2.2 0 0 1 .2 10.6V3.4A2.2 2.2 0 0 1 2.4 1.2Z"/><path d="M12.3 5.3l4.3-2.9a.62.62 0 0 1 .97.51v8.18a.62.62 0 0 1-.97.51L12.3 8.7Z"/></svg>';

     pending dismiss must not clear the Rust side under a card that is up. */

  clearTimeout(fittedTimer);
  clearTimeout(fixTimer);

  clearText();

     tray uses in its glyph column (DICTATION and CLIP in tray.rs). */
  const fixed = cardKind === 'fixed';
  glyphEl.innerHTML = fixed ? ICON_BOOK
    : payload.note ? ICON_VIDEO

  saidEl.textContent = payload.text || '';

  cardEl.className = 'measuring';

  copyEl.textContent = fixed ? 'Review' : 'Copy';
  copyEl.title = fixed ? 'Open it in the Dictionary' : '';

  const width = Math.max(CARD_MIN, Math.min(CARD_MAX, natural));

  if (natural > width) {
    saidEl.style.width = Math.floor(saidEl.getBoundingClientRect().width - (natural - width)) + 'px';
  }
  cardEl.style.width = width + 'px';
  cardWidth = width;

    width: Math.ceil(cardEl.getBoundingClientRect().width) + CARD_MARGIN,
    height: CARD_H + CARD_MARGIN_Y,

     zero opacity inside an enlarged window that has already stopped being

cardEl.addEventListener('mouseenter', () => clearTimeout(fixTimer));
cardEl.addEventListener('mouseleave', () => {

const CHIP_W = 46;
window.__TAURI__.event.listen('pill-fitted', openCard);
function openCard() {
  if (!carded || cardEl.classList.contains('on')) return;

     the measured width. Two frames later the class flips and it opens. */

   chip and 1 once the cluster is at the left end, and from then on the
   cluster rides the capsule's left edge, moving by half of each growth like
   the words. The talking span is held at the talking width once the growth
   starts, so the bars only ever move left, away from the words, and the
   count stays at 13. */
function clusterAt(W) {
  const u = wide ? Math.max(0, Math.min(1, (W - DIMS.full.w) / Math.max(1, openW - DIMS.full.w))) : 0;
  const Wt = wide ? Math.min(W, DIMS.full.w) : W;
  const pad = Math.min(10, Math.max(4, Wt * 0.1)), spanW = Math.max(6, Wt - pad * 2);
  const innerW = spanW + (CLUSTER_W - spanW) * u;
  const x0 = (CX - spanW / 2) + ((CX - W / 2 + WIDE_PAD) - (CX - spanW / 2)) * u;
  return { x0, innerW };
}
/* The text's mask and position for a capsule W wide, in the text layer's
   coordinates (the canvas's). The mask is one gradient with four stops: the
   left fade, then opaque, then the right fade, which ends EDGE_R inside the
   capsule's right edge and starts where the text rests, so the growing edge
   uncovers a word through it. The left fade sits before the first letter
   while the line grows and moves into the text as the line turns full
   (fadeU), where old words leave through it. The stops are kept in order, so
   a slot narrower than its fades, early in the opening, is a soft sliver. */
let placedMask = '', placedTx = Infinity;   /* Infinity, not NaN: a NaN compare is false and would skip the first write */
function placeWords(W) {
  const xL = CX - W / 2, xR = CX + W / 2, textX = xL + TEXT_X;
  const a = textX - FADE_L_IN * (1 - fadeU), b = Math.max(a, textX + FADE_L * fadeU);
  const d = Math.max(b, xR - EDGE_R), c = Math.max(b, d - FADE_R);
  const mask = `linear-gradient(to right, transparent ${a.toFixed(1)}px, #000 ${b.toFixed(1)}px, `
             + `#000 ${c.toFixed(1)}px, transparent ${d.toFixed(1)}px)`;
  if (mask !== placedMask) {
    placedMask = mask;
    iclipEl.style.webkitMaskImage = mask;
    iclipEl.style.maskImage = mask;
  }
  /* Left-aligned after the bars until full, then pinned PAD_R inside the right
     edge. The line's box is anchored at the layer's right edge (CSS), so the
     transform is the distance from there. */
  const right = (full ? xR - PAD_R : textX + lineW) + stepX;
  const tx = right - CV_W;
  if (Math.abs(tx - placedTx) > 0.01) {
    placedTx = tx;
    ilineEl.style.transform = `translate3d(${tx.toFixed(2)}px,0,0)`;
  }
}
/* Called every frame with the chip's geometry and the frame's dt: the step
   and the left fade ease (95% in about 170 ms), the mask and the line follow
   the capsule, and the text follows the chip's own fade out. */
function syncWords(g, dt) {
  if (closing && (g.sc < 0.02 || taking(st))) finishHide();
  if (wide) {
    if (stepX) { stepX -= stepX * Math.min(1, dt * SETTLE_K); if (Math.abs(stepX) < 0.2) stepX = 0; }
    if (full && fadeU < 1) { fadeU += (1 - fadeU) * Math.min(1, dt * SETTLE_K); if (fadeU > 0.995) fadeU = 1; }
    placeWords(g.W);
  }
  const a = wide ? Math.min(1, g.sc) : 0;
  if (Math.abs(a - shownAlpha) < 0.004 && (a === 0) === (shownAlpha === 0)) return;
  shownAlpha = a;
  iwrapEl.style.opacity = a.toFixed(3);
}

copyEl.addEventListener('click', () => {
  if (carded && cardKind === 'fixed') {
    window.__TAURI__.event.emit('pill-action', 'review');
    hideCard();
    return;
  }
  if (!carded || copyEl.classList.contains('done')) return;
  window.__TAURI__.event.emit('pill-action', 'copy');
  copyEl.textContent = 'Copied';
  copyEl.classList.add('done');
  collapseTimer = setTimeout(hideCard, 850);
});
document.getElementById('cx').addEventListener('click', hideCard);

window.__TAURI__.event.listen('pill', ({ payload: p }) => {
  if (p.kind === 'preview') { showPreview(p.text); return; }
  clearTimeout(hideTimer);
  if (p.kind === 'held' || p.kind === 'fixed') { hidePreview(); showCard(p); return; }
  if (carded) hideCard();
  if (p.kind === 'hide') { activity = null; st = 'hidden'; clearText(); hidePreview(); return; }
  if (p.kind === 'show') {
    activity = p;
    applyActivity(p);
    /* Released: keep the last raw preview, dimmed, while the final pass runs. */
    if (st === 'transcribe') settlePreview();
    return;
  }
  // 'bars' and 'flash' both ride the same decay; only the shutter pinches.
  if (p.kind === 'shot') {
    fx[SHOT_FEEDBACK === 'shutter' ? 'shutter' : 'flash'] = 1;
    return;
  }
  if (p.ends) { activity = null; st = 'hidden'; hidePreview(); }
  notice = true;
  showText(p.tone, p.text);
  hideTimer = setTimeout(() => {
    activity ? applyActivity(activity) : (clearText(), st = 'hidden');
  }, p.tone === 'error' ? 3000 : 1600);
});
window.__TAURI__.event.listen('levels', ({ payload: p }) => {
  for (let i = 0; i < N; i++) bandT[i] = p.b[i];
  avgT = p.avg;
  lastLevels = performance.now();
});

/* ---------- band smoothing (attack 28, release 6) + synthetic fallback ---------- */
const bands = new Float32Array(N);
function tickBands(t, dt, active) {
  if (active && performance.now() - lastLevels > 350) {
    /* no live levels (replay seam, or mic owned elsewhere): keep the chip alive */
    const env = 0.22 + 0.12 * Math.sin(t * 1.3);
    for (let i = 0; i < N; i++)
      bandT[i] = Math.max(0, env * (0.5 + 0.5 * Math.sin(t * 9 + i * 1.7)) * Math.exp(-i / N * 1.6));
    avgT = env;
  }
  for (let i = 0; i < N; i++) {
    const tv = active ? bandT[i] : 0;
    if (tv > bands[i]) bands[i] += (tv - bands[i]) * Math.min(1, dt * 28);
    else bands[i] += (tv - bands[i]) * Math.min(1, dt * 6);
  }
}
function balancedBands(n, gain, tilt, mirror) {
  const out = new Array(n), mid = (n - 1) / 2;
  const pick = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i / n * N), z = Math.max(a + 1, Math.ceil((i + 1) / n * N));
    let m = 0;
    for (let j = a; j < z; j++) m = Math.max(m, bands[j]);
    pick[i] = Math.min(1, Math.min(1, m * gain) * (0.7 + tilt * (i / Math.max(1, n - 1))));
  }
  if (!mirror) return pick;
  for (let j = 0; j < n; j++) {
    const u = Math.abs(j - mid) / mid;
    out[j] = pick[Math.min(n - 1, Math.round(u * (n - 1)))];
  }
  return out;
}

/* ---------- geometry ---------- */
const store = { pres: 0, sw: makeSpring(K_BOUNCY, C_BOUNCY, DIMS.armed.w),
                sh: makeSpring(K_BOUNCY, C_BOUNCY, DIMS.armed.h),
                sc: makeSpring(K_BOUNCY, C_BOUNCY, 0), morph: makeSpring(1, 1, 0) };
function geom(dt) {
  const talking = avgT > TUNE.thresh;
  const listening = taking(st);
  const loading = st === 'transcribe' || st === 'save';
  store.pres += ((listening && talking ? 1 : 0) - store.pres) * Math.min(1, dt * (talking ? 7 : TUNE.wilt));
  const resp = TUNE.resp * (loading ? 0.72 : 1);
  /* The widen is critically damped: 170 px of travel would show the bloom's
     usual overshoot as a bounce. */
  const K = Math.pow(2 * Math.PI / resp, 2), C = 2 * (wide ? 1 : TUNE.damp) * Math.sqrt(K);
  store.sw.K = K; store.sw.C = C; store.sh.K = K; store.sh.C = C;
  let tw, th;
  /* Wide holds through talking, silence, the final pass and the fade out; capW
     only ever grows within a take. finishHide() resets it unseen. */
  if (wide) { tw = capW; th = CAP_H; }
  else if (listening) {
    tw = DIMS.rest.w + (DIMS.full.w - DIMS.rest.w) * store.pres;
    th = DIMS.rest.h + (DIMS.full.h - DIMS.rest.h) * store.pres;
  } else if (loading) { tw = DIMS.load.w; th = DIMS.load.h; }
  else { tw = DIMS.armed.w; th = DIMS.armed.h; }
  const sc = stepSpring(store.sc, st === 'hidden' || notice ? 0 : 1, dt);
  return { W: Math.max(4, stepSpring(store.sw, tw, dt)),
           H: Math.max(4, stepSpring(store.sh, th, dt)), sc: Math.max(0, sc) };
}

/* ---------- drawing ---------- */
const cv = document.getElementById('cv');
const dpr = window.devicePixelRatio || 2;
cv.width = CV_W * dpr; cv.height = 48 * dpr;
/* Sized from the same constants as the capsule, so a new MAX_W needs no CSS change. */
cv.style.width = CV_W + 'px'; cv.style.marginLeft = -CX + 'px';
const ctx = cv.getContext('2d');
function bodyShell(cx, cy, w, h, r, ring) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(13,14,18,0.97)';
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.stroke();
  /* A locked take wears a lit ring for as long as it runs. The bars say the mic
     is live; this says nothing is holding it but the lock. */
  if (!ring) return;
  ctx.save();
  ctx.strokeStyle = css(ring, 0.95); ctx.lineWidth = 1.5;
  ctx.shadowColor = css(ring, 0.7); ctx.shadowBlur = 6;
  const o = 2.5;
  ctx.beginPath();
  ctx.roundRect(cx - w / 2 - o, cy - h / 2 - o, w + o * 2, h + o * 2, r + o);
  ctx.stroke();
  ctx.restore();
}
function fillGlow(x, y, w, h, r, a, col) {
  ctx.save();
  ctx.shadowColor = css(col, 0.8); ctx.shadowBlur = 5;
  ctx.fillStyle = css(col, a);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.restore();
}
let last = performance.now(), fadeGlyph = 'bars';
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const active = taking(st);
  tickBands(t, dt, active);
  const g = geom(dt);
  const morphResp = 0.4;
  store.morph.K = Math.pow(2 * Math.PI / morphResp, 2);
  store.morph.C = 2 * Math.sqrt(store.morph.K);
  const morph = Math.max(0, Math.min(1, stepSpring(store.morph, st === 'record' ? 1 : 0, dt)));
  fx.flash = Math.max(0, fx.flash - dt * 4.5);
  fx.shutter = Math.max(0, fx.shutter - dt * 5);
  const pinch = fx.shutter > 0 ? Math.sin(Math.PI * fx.shutter) : 0;
  const H = SHOT_FEEDBACK === 'shutter' ? g.H * (1 - 0.68 * pinch) : g.H;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (g.sc > 0.02) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = Math.min(1, g.sc);
    draw(t, g.W, H, morph, pinch);
    ctx.globalAlpha = 1;
  }
  syncWords(g, dt);
  requestAnimationFrame(frame);
}
function draw(t, W, H, morph, pinch) {
  const cx = CX, cy = 25;
  // A shot whitens the sound itself rather than the chip behind it, so the
  // thing that flashes is the thing that was listening.
  const lift = SHOT_FEEDBACK === 'bars' && fx.flash > 0 ? Math.pow(fx.flash, 0.55) : 0;
  const accent = mix(morphColor(morph), WHITE, lift);
  bodyShell(cx, cy, W, H, Math.min(W, H) / 2, (st === 'lock' || activity?.activity === 'recording-locked') ? accent : null);
  /* Past the talking width the sound moves from the middle to a cluster at the
     left end, in step with the first growth, and the dot goes with it.
     clusterAt() holds the geometry, since the words start where it ends. */
  const { x0, innerW } = clusterAt(W);
  const fx0 = x0 + innerW / 2;
  const maxBarH = H - 10, lineTh = 2.5;
  /* While the wide capsule fades out, `st` is already hidden; keep whatever
     was drawn last, or the dot would turn into a 54 px line for the fade. */
  const dot = st === 'transcribe' || st === 'save' || (st === 'hidden' && wide && fadeGlyph === 'dot');
  if (st !== 'hidden') fadeGlyph = dot ? 'dot' : 'bars';
  if (dot) {
    /* breathing bloom: swells and settles, no rotation */
    const speed = (st === 'save' ? 1.7 : 1) * TUNE.load;
    const r = Math.max(3, Math.min(W, H) / 2 - 5);
    const p = 0.5 + 0.5 * Math.sin(t * speed * Math.PI * 1.6);
    const grad = ctx.createRadialGradient(fx0, cy, 0.4, fx0, cy, r * (0.5 + 0.6 * p));
    grad.addColorStop(0, css(accent, 0.55 + 0.35 * p)); grad.addColorStop(1, css(accent, 0));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(fx0, cy, r + 3, 0, 7); ctx.fill();
    ctx.save();
    ctx.shadowColor = css(accent, 0.9); ctx.shadowBlur = 7;
    ctx.fillStyle = css(accent, 0.75 + 0.25 * p);
    ctx.beginPath(); ctx.arc(fx0, cy, 1.9, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }
  /* baseline: silence is just a line */
  fillGlow(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, 0.4, accent);
  /* spectrum bars; recording is the same spectrum in red */
  const n = Math.max(5, Math.min(21, 1 + 2 * Math.floor(innerW / 9)));
  const gap = 2, bw = Math.max(1.5, (innerW - (n - 1) * gap) / n);
  const vs = balancedBands(n, 1.5, 1.6, true);
  for (let i = 0; i < n; i++) {
    const bh = lineTh + vs[i] * (maxBarH - lineTh);
    if (bh <= lineTh + 0.4) continue;
    fillGlow(x0 + i * (bw + gap), cy - bh / 2, bw, bh, Math.min(bw / 2, 2),
             0.9 * (0.45 + 0.55 * Math.min(1, vs[i] * 1.4)), accent);
  }
  if (SHOT_FEEDBACK === 'shutter' && pinch > 0.5) {
    ctx.save();
    ctx.globalAlpha = (pinch - 0.5) * 2;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4;
    ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(cx - W / 2 + 4, cy); ctx.lineTo(cx + W / 2 - 4, cy); ctx.stroke();
    ctx.restore();
  }
}
requestAnimationFrame(frame);
</script>
