<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dictionary</title>
<style>
  /* No style attributes anywhere: Tauri's CSP nonce makes 'unsafe-inline'
     inert, so every visual state is a class in this sheet. */
  /* AppKit's own colors, which WebKit resolves per appearance and accent. */
  :root {
    color-scheme: light dark;
    --label: -apple-system-label;
    --secondary: -apple-system-secondary-label;
    --tertiary: -apple-system-tertiary-label;
    --separator: -apple-system-separator;
    --fill: rgba(128,128,128,.12);
    --content: -apple-system-text-background;
    --selected: -apple-system-selected-content-background;
    --unemphasized: -apple-system-unemphasized-selected-content-background;
    --red: -apple-system-red;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fill: rgba(255,255,255,.08); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font: 13px/1.38 -apple-system, system-ui, sans-serif; color: var(--label);
    display: grid; grid-template-columns: 236px 1fr; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  input, button { font: inherit; }
  h1, h2, p { margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---- sidebar: the window's vibrancy shows through ---- */
  #sidebar { display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--separator); }
  .chrome { height: 52px; flex: 0 0 auto; }
  .search { padding: 0 10px 8px; }
  .search input { width: 100%; }
  #list { flex: 1 1 auto; overflow-y: auto; padding: 0 10px 10px; outline: none; overscroll-behavior: contain; }
  .group + .group { margin-top: 14px; }
  .group-label { padding: 0 8px 3px; font-size: 11px; font-weight: 600; color: var(--tertiary); }
  .option {
    display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px;
    white-space: nowrap;
  }
  .option.two { height: 40px; }
  .option .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .option .sub { display: block; font-size: 11px; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; }
  .option .count { flex: 0 0 auto; font-size: 11px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .option.parked .name { color: var(--secondary); }
  .option[aria-selected="true"] { background: var(--unemphasized); }
  #list.focused .option[aria-selected="true"] {
    background: var(--selected); color: #fff;
  }
  #list.focused .option[aria-selected="true"] .sub,
  #list.focused .option[aria-selected="true"] .count,
  #list.focused .option[aria-selected="true"] .name { color: rgba(255,255,255,.86); }
  #list.focused .option[aria-selected="true"] .name { color: #fff; }
  .list-empty { padding: 18px 8px; color: var(--secondary); }
  .list-empty p + p { margin-top: 4px; }
  .list-empty button { margin-top: 10px; }
  .bar { flex: 0 0 auto; display: flex; align-items: center; height: 36px; padding: 0 10px; }
  .plain {
    -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: var(--secondary);
    height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px;
    transition-property: background-color, color; transition-duration: .12s; transition-timing-function: ease-out;
  }
  .plain:hover { background: var(--fill); color: var(--label); }
  .plain:active { background: var(--unemphasized); }
  .plain svg { width: 12px; height: 12px; }

  /* ---- detail ---- */
  #detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--content); }
  .toolbar { height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 20px; }
  .toolbar h1 { font-size: 13px; font-weight: 600; }
  .toolbar .summary { color: var(--secondary); }
  #pane { flex: 1 1 auto; overflow-y: auto; padding: 8px 28px 28px; -webkit-user-select: text; user-select: text; }
  .pane-empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--secondary); padding-bottom: 40px; }
  .title-row { display: flex; align-items: center; gap: 10px; margin-inline-start: -6px; }
  .title {
    -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; border: 0; border-radius: 6px;
    background: transparent; color: var(--label); padding: 2px 6px; font-size: 22px; font-weight: 600; letter-spacing: -.01em;
  }
  .title:hover { background: var(--fill); }
  .title:focus { background: transparent; }
  .title[readonly]:hover, .title.static:hover { background: transparent; }
  .tag { flex: 0 0 auto; font-size: 11px; font-weight: 500; color: var(--secondary); background: var(--fill); border-radius: 5px; padding: 1px 6px; }
  .source { margin-top: 2px; color: var(--secondary); }
  #message { min-height: 0; margin-top: 10px; }
  #message:empty { display: none; }
  #message.error { color: var(--red); }
  section { margin-top: 26px; }
  section > h2 { font-size: 13px; font-weight: 600; }
  .help { margin-top: 3px; color: var(--secondary); max-width: 34em; }
  .stats { display: flex; gap: 10px; margin-top: 18px; }
  .stat { flex: 0 1 160px; padding: 10px 12px; border-radius: 10px; background: var(--fill); }
  .stat strong { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--secondary); }
  .stats + .help { margin-top: 8px; }
  .rules { list-style: none; margin: 10px 0 0; padding: 0; max-width: 30em; }
  .rule { display: flex; align-items: center; gap: 8px; }
  .rule + .rule { margin-top: 6px; }
  .rule input { flex: 1 1 auto; min-width: 0; }
  .rule .arrow { flex: 0 0 auto; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 12em; }
  .rule .plain { flex: 0 0 auto; width: 24px; padding: 0; justify-content: center; }
  .rules-empty { margin-top: 8px; color: var(--secondary); }
  .add-rule { margin-top: 8px; margin-inline-start: -8px; }
  .boost { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .boost input { width: 72px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--separator); }
  .actions .spacer { flex: 1 1 auto; }
  .confirm { margin-top: 30px; padding: 14px 16px; border-radius: 10px; background: var(--fill); }
  .confirm p + p { margin-top: 2px; color: var(--secondary); }
  .confirm .buttons { display: flex; gap: 10px; margin-top: 12px; }
  .danger { color: var(--red); }
  .new-word { margin-top: 18px; max-width: 30em; }
  .new-word label { display: block; font-weight: 600; margin-bottom: 6px; }
  .new-word input { width: 100%; }
  .new-word .buttons { display: flex; gap: 10px; margin-top: 16px; }
  .footer { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 16px 0 28px; border-top: 1px solid var(--separator); color: var(--secondary); font-size: 12px; }
  .footer #status { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footer .plain { font-size: 12px; }
</style>

<nav id="sidebar" aria-label="Words">
  <div class="chrome" data-tauri-drag-region></div>
  <div class="search">
    <input id="search" type="search" placeholder="Search" aria-label="Search words" spellcheck="false" autocomplete="off">
  </div>
  <div id="list" role="listbox" tabindex="0" aria-label="Words"></div>
  <div class="bar">
    <button id="add" class="plain" type="button" title="Add Word (⌘N)">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"/></svg>
      Add Word
    </button>
  </div>
</nav>

<main id="detail">
  <div class="toolbar" data-tauri-drag-region>
    <h1 data-tauri-drag-region>Dictionary</h1>
    <span id="summary" class="summary" data-tauri-drag-region></span>
  </div>
  <div id="pane"></div>
  <div class="footer">
    <span id="status" role="status">Changes apply to your next dictation.</span>
    <button id="reveal" class="plain" type="button">Show in Finder</button>
  </div>
</main>

<script>
const { invoke } = window.__TAURI__.core;
const IDLE = 'Changes apply to your next dictation.';
const view = {
  snap: null,
  selected: null,   // { kind: 'word' | 'waiting' | 'new', key }
  query: '',
  confirming: false,
  saving: false,
  stale: false,
  draft: '',
  draftRule: null,  // key of the word whose new heard form is being typed
  message: null,    // { text, error }
};
const list = document.getElementById('list');
const pane = document.getElementById('pane');
const search = document.getElementById('search');
const statusLine = document.getElementById('status');

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null) continue;
    if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
    else if (key === 'class') node.className = value;
    else if (key in node && !key.includes('-')) node[key] = value;
    else if (value !== false) node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

const keyOf = term => term.toLowerCase();
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many}`;
const quoted = text => `“${text}”`;

function matches(word) {
  const q = view.query.trim().toLowerCase();
  if (!q) return true;
  return word.term.toLowerCase().includes(q) || (word.rules || []).some(r => r.heard.toLowerCase().includes(q))
    || (word.heard || '').toLowerCase().includes(q);
}

/* The options in the order the list shows them, so arrow keys and the
   selection after a delete follow what is on screen. */
function visible() {
  if (!view.snap) return [];
  const waiting = view.snap.waiting.filter(matches).map(w => ({ kind: 'waiting', key: keyOf(w.term), item: w }));
  const words = view.snap.words.filter(matches);
  return [
    ...waiting,
    ...words.filter(w => !w.parked).map(w => ({ kind: 'word', key: keyOf(w.term), item: w })),
    ...words.filter(w => w.parked).map(w => ({ kind: 'word', key: keyOf(w.term), item: w })),
  ];
}

function find(selection) {
  if (!view.snap || !selection) return null;
  if (selection.kind === 'waiting') return view.snap.waiting.find(w => keyOf(w.term) === selection.key) || null;
  if (selection.kind === 'word') return view.snap.words.find(w => keyOf(w.term) === selection.key) || null;
  return null;
}

function select(selection, { focusList = false } = {}) {
  if (editing() && document.activeElement && pane.contains(document.activeElement)) document.activeElement.blur();
  view.draftRule = null;
  view.selected = selection;
  view.confirming = false;
  view.message = null;
  render();
  if (focusList) list.focus();
}

function renderList() {
  const options = visible();
  const scroll = list.scrollTop;
  list.replaceChildren();
  if (!view.snap) return;
  if (!options.length) {
    if (view.query.trim()) {
      list.append(h('div', { class: 'list-empty' },
        h('p', {}, `No words match ${quoted(view.query.trim())}.`),
        h('button', { type: 'button', onclick: () => startNew(view.query.trim()) }, `Add ${quoted(view.query.trim())}`)));
    } else {
      list.append(h('div', { class: 'list-empty' },
        h('p', {}, 'No words yet.'),
        h('p', {}, 'Add the names and terms dictation gets wrong.')));
    }
    list.removeAttribute('aria-activedescendant');
    return;
  }
  const groups = [
    ['waiting', 'Seen once', options.filter(o => o.kind === 'waiting')],
    ['words', 'Words', options.filter(o => o.kind === 'word' && !o.item.parked)],
    ['parked', 'Parked', options.filter(o => o.kind === 'word' && o.item.parked)],
  ];
  let active = null;
  options.forEach((option, index) => { option.id = `option-${index}`; });
  for (const [id, label, members] of groups) {
    if (!members.length) continue;
    const group = h('div', { class: 'group', role: 'group', 'aria-labelledby': `group-${id}` },
      h('div', { class: 'group-label', id: `group-${id}` }, label));
    for (const option of members) {
      const selected = view.selected && view.selected.kind === option.kind && view.selected.key === option.key;
      const word = option.item;
      let row;
      if (option.kind === 'waiting') {
        row = h('div', { class: 'option two', role: 'option', id: option.id, 'aria-selected': String(!!selected) },
          h('span', { class: 'name' }, word.term,
            word.heard ? h('span', { class: 'sub' }, `heard ${quoted(word.heard)}`) : null));
      } else {
        row = h('div', {
          class: `option${word.parked ? ' parked' : ''}`, role: 'option', id: option.id,
          'aria-selected': String(!!selected),
          'aria-description': word.misheard ? `${word.misheard} misheard` : null,
        },
          h('span', { class: 'name' }, word.term),
          word.misheard && !word.parked ? h('span', { class: 'count', 'aria-hidden': 'true' }, `${word.misheard.toLocaleString()} misheard`) : null);
      }
      row.addEventListener('mousedown', event => {
        event.preventDefault();
        select({ kind: option.kind, key: option.key }, { focusList: true });
      });
      if (selected) active = row;
      group.append(row);
    }
    list.append(group);
  }
  list.scrollTop = scroll;
  if (active) {
    list.setAttribute('aria-activedescendant', active.id);
    active.scrollIntoView({ block: 'nearest' });
  } else {
    list.removeAttribute('aria-activedescendant');
  }
}

function renderSummary() {
  const summary = document.getElementById('summary');
  if (!view.snap) { summary.textContent = ''; return; }
  const active = view.snap.words.filter(w => !w.parked).length;
  const parts = [plural(active, 'word', 'words')];
  if (view.snap.waiting.length) parts.push(`${view.snap.waiting.length.toLocaleString()} seen once`);
  summary.textContent = parts.join(' · ');
}

function messageNode() {
  const node = h('p', { id: 'message', class: view.message && view.message.error ? 'error' : null, role: 'status' });
  if (view.message) node.textContent = view.message.text;
  return node;
}

function sources(word) {
  if (word.parked) return 'Parked in vocabulary.md, so it isn’t boosted.';
  if (word.vocabulary && word.learned) return 'In vocabulary.md and learned from your fixes.';
  if (word.learned) return 'Learned from your fixes. Saved in learned.md.';
  return 'In vocabulary.md.';
}

function renderWord(word) {
  const editable = !word.parked;
  const title = h('input', {
    class: 'title', value: word.term, 'aria-label': 'Word', spellcheck: false, autocomplete: 'off',
    readOnly: !editable, 'data-focus': 'title', 'data-original': word.term,
  });
  if (editable) {
    title.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); title.blur(); }
      if (event.key === 'Escape') { event.preventDefault(); title.value = word.term; title.blur(); }
    });
    title.addEventListener('blur', () => {
      if (rendering) return;
      const to = title.value.trim();
      if (!to) { title.value = word.term; return; }
      if (to === word.term) return;
      edit({ op: 'rename', term: word.term, to }, { kind: 'word', key: keyOf(to) });
    });
  }
  const nodes = [
    h('div', { class: 'title-row' }, title),
    h('p', { class: 'source' }, sources(word)),
    messageNode(),
  ];
  if (!word.parked) {
    const heard = view.snap.dictations;
    nodes.push(h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('strong', {}, word.right.toLocaleString()), h('span', {}, 'came out right')),
      h('div', { class: 'stat' }, h('strong', {}, word.misheard.toLocaleString()), h('span', {}, 'misheard'))));
    nodes.push(h('p', { class: 'help' }, word.right || word.misheard
      ? `Counted across ${plural(heard, 'saved dictation', 'saved dictations')}. Misheard counts other casings and the heard forms below.`
      : `Not seen in your ${plural(heard, 'saved dictation', 'saved dictations')} yet.`));
    nodes.push(renderRules(word));
    nodes.push(renderBoost(word));
  } else if (word.rules.length) {
    nodes.push(h('section', {}, h('h2', {}, 'Heard as'),
      h('ul', { class: 'rules' }, word.rules.map(rule => h('li', { class: 'rule' }, h('span', {}, `${rule.heard} → ${word.term}`))))));
  }
  nodes.push(renderActions(word));
  return nodes;
}

function renderRules(word) {
  const rows = word.rules.map((rule, index) => {
    const input = h('input', {
      type: 'text', value: rule.heard, spellcheck: false, autocomplete: 'off',
      'aria-label': `Heard form ${index + 1}`, 'data-focus': `rule-${keyOf(rule.heard)}`, 'data-original': rule.heard,
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
      if (event.key === 'Escape') { event.preventDefault(); input.value = rule.heard; input.blur(); }
    });
    input.addEventListener('blur', () => {
      if (rendering) return;
      const to = input.value.trim();
      if (!to) { input.value = rule.heard; return; }
      if (to === rule.heard) return;
      edit({ op: 'rule', term: word.term, from: rule.heard, to });
    });
    return h('li', { class: 'rule' },
      input,
      h('span', { class: 'arrow', 'aria-hidden': 'true' }, `→ ${word.term}`),
      rule.learned ? h('span', { class: 'tag' }, 'Learned') : null,
      h('button', {
        class: 'plain', type: 'button', 'aria-label': `Remove heard form ${quoted(rule.heard)}`, title: 'Remove',
        onclick: () => edit({ op: 'rule', term: word.term, from: rule.heard, to: null }),
      }, minus()));
  });
  const adding = view.draftRule === keyOf(word.term);
  if (adding) {
    const input = h('input', { type: 'text', placeholder: 'superbase', spellcheck: false, autocomplete: 'off', 'aria-label': 'New heard form', 'data-focus': 'rule-new', 'data-original': '' });
    const finish = save => {
      const to = input.value.trim();
      view.draftRule = null;
      if (save && to) edit({ op: 'rule', term: word.term, from: null, to });
      else render();
    };
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); finish(true); }
      if (event.key === 'Escape') { event.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => { if (!rendering && view.draftRule) finish(true); });
    rows.push(h('li', { class: 'rule' }, input, h('span', { class: 'arrow', 'aria-hidden': 'true' }, `→ ${word.term}`)));
    queueMicrotask(() => input.focus());
  }
  return h('section', { 'aria-labelledby': 'rules-heading' },
    h('h2', { id: 'rules-heading' }, 'Heard as'),
    h('p', { class: 'help' }, `When the model writes one of these, see.computer replaces it with ${word.term}.`),
    rows.length ? h('ul', { class: 'rules' }, rows) : h('p', { class: 'rules-empty' }, 'None yet. Add one if the model keeps writing a different word.'),
    adding ? null : h('button', {
      class: 'plain add-rule', type: 'button',
      onclick: () => { view.draftRule = keyOf(word.term); render(); },
    }, plus(), 'Add Heard Form'));
}

function renderBoost(word) {
  const input = h('input', {
    id: 'boost', type: 'number', min: '0.5', max: '100', step: '0.5', value: String(word.weight),
    'data-focus': 'boost', 'data-original': String(word.weight), 'aria-describedby': 'boost-help',
  });
  let timer = null;
  const commit = () => {
    clearTimeout(timer);
    const weight = Number(input.value);
    if (!input.value || !Number.isFinite(weight) || weight === word.weight) return;
    edit({ op: 'weight', term: word.term, weight });
  };
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(commit, 600); });
  input.addEventListener('change', commit);
  input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); commit(); } });
  return h('section', {},
    h('h2', {}, h('label', { htmlFor: 'boost' }, 'Boost')),
    h('div', { class: 'boost' }, input),
    h('p', { class: 'help', id: 'boost-help' },
      '1 is normal. A higher boost helps the model pick this word, and can pull similar-sounding words toward it.'));
}

function renderActions(word) {
  if (view.confirming) {
    const cancel = h('button', { type: 'button', onclick: () => { view.confirming = false; render(); } }, 'Cancel');
    queueMicrotask(() => cancel.focus());
    return h('div', { class: 'confirm', role: 'group', 'aria-labelledby': 'confirm-title' },
      h('p', { id: 'confirm-title' }, h('strong', {}, `Delete ${quoted(word.term)}?`)),
      h('p', {}, word.parked
        ? 'It is removed from vocabulary.md.'
        : word.learned
          ? 'It stops being boosted, its heard forms stop being replaced, and see.computer won’t learn it again.'
          : 'It stops being boosted and its heard forms stop being replaced.'),
      h('div', { class: 'buttons' },
        h('button', { type: 'button', class: 'danger', onclick: () => deleteWord(word) }, 'Delete Word'),
        cancel));
  }
  const actions = h('div', { class: 'actions' });
  if (word.parked) {
    actions.append(h('button', { type: 'button', onclick: () => edit({ op: 'unpark', term: word.term }) }, 'Turn On'));
  } else if (!word.learned) {
    actions.append(h('button', {
      type: 'button', title: 'Keep it in vocabulary.md without boosting it',
      onclick: () => edit({ op: 'park', term: word.term }),
    }, 'Park'));
  }
  actions.append(h('span', { class: 'spacer' }),
    h('button', { type: 'button', onclick: () => { view.confirming = true; render(); } }, 'Delete…'));
  return actions;
}

function renderWaiting(waiting) {
  return [
    h('div', { class: 'title-row' }, h('input', { class: 'title', value: waiting.term, readOnly: true, 'aria-label': 'Word' })),
    h('p', { class: 'source' }, waiting.heard
      ? `You fixed ${quoted(waiting.heard)} to ${quoted(waiting.term)} once. A second fix teaches it automatically.`
      : 'You fixed this spelling once. A second fix teaches it automatically.'),
    messageNode(),
    h('div', { class: 'actions' },
      h('button', { type: 'button', onclick: () => edit({ op: 'learn', term: waiting.term }, { kind: 'word', key: keyOf(waiting.term) }) }, 'Learn Now'),
      h('button', { type: 'button', onclick: () => ignore(waiting) }, 'Ignore')),
    h('p', { class: 'help' }, 'Learning adds it to learned.md. Ignoring means see.computer won’t suggest it again.'),
  ];
}

function renderNew() {
  const input = h('input', {
    id: 'new-word', type: 'text', value: view.draft, placeholder: 'Supabase', spellcheck: false, autocomplete: 'off',
    'data-focus': 'new', 'aria-describedby': 'new-help',
    'aria-invalid': view.message && view.message.error ? 'true' : null,
  });
  input.addEventListener('input', () => { view.draft = input.value; });
  const submit = event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) { view.message = { text: 'Type a word to add.', error: true }; render(); return; }
    const term = text.includes(' -> ') ? text.split(' -> ').pop().trim() : text;
    edit({ op: 'add', text }, { kind: 'word', key: keyOf(term) }, () => { view.draft = ''; });
  };
  input.addEventListener('keydown', event => { if (event.key === 'Escape') { event.preventDefault(); cancelNew(); } });
  queueMicrotask(() => { if (document.activeElement !== input) input.focus(); });
  return [
    h('div', { class: 'title-row' }, h('h2', { class: 'title static' }, 'New Word')),
    messageNode(),
    h('form', { class: 'new-word', onsubmit: submit },
      h('label', { htmlFor: 'new-word' }, 'Word'),
      input,
      h('p', { class: 'help', id: 'new-help' },
        'Write it the way it should appear. If the model hears it as something else, write heard -> Word, like superbase -> Supabase.'),
      h('div', { class: 'buttons' },
        h('button', { type: 'submit' }, 'Add Word'),
        h('button', { type: 'button', onclick: cancelNew }, 'Cancel'))),
  ];
}

function renderDetail() {
  const focus = rememberFocus();
  rendering = true;
  pane.replaceChildren();
  rendering = false;
  if (!view.snap) {
    if (view.message) {
      pane.append(h('div', { class: 'pane-empty' }, h('div', {},
        messageNode(),
        h('button', { type: 'button', onclick: reload }, 'Try Again'))));
    }
    return;
  }
  const selection = view.selected;
  let nodes;
  if (selection && selection.kind === 'new') nodes = renderNew();
  else {
    const item = find(selection);
    if (item && selection.kind === 'waiting') nodes = renderWaiting(item);
    else if (item) nodes = renderWord(item);
    else {
      nodes = [h('div', { class: 'pane-empty' }, h('div', {},
        h('p', {}, view.snap.words.length || view.snap.waiting.length ? 'Select a word to see how it has come out.' : 'Your dictionary is empty.'),
        view.message ? messageNode() : null))];
    }
  }
  pane.append(...nodes);
  restoreFocus(focus);
}

/* A redraw rebuilds the pane, so the focused field, its caret, and any text
   not saved yet are carried across by the field's data-focus key. */
let rendering = false;
function rememberFocus() {
  const active = document.activeElement;
  if (!active || !pane.contains(active) || !active.dataset.focus) return null;
  const dirty = 'original' in active.dataset && active.value !== active.dataset.original;
  return { key: active.dataset.focus, value: dirty ? active.value : null, start: active.selectionStart, end: active.selectionEnd };
}

function restoreFocus(focus) {
  if (!focus) return;
  const node = pane.querySelector(`[data-focus="${CSS.escape(focus.key)}"]`);
  if (!node) return;
  if (focus.value != null) node.value = focus.value;
  node.focus();
  try { node.setSelectionRange(focus.start, focus.end); } catch (_) {}
}

function render() {
  renderSummary();
  renderList();
  renderDetail();
}

/* Something in the detail pane holds typing the files do not have yet. A
   reload then would throw it away, so it waits until that field commits. */
function editing() {
  const active = document.activeElement;
  return !!(active && pane.contains(active) && active.tagName === 'INPUT' && 'original' in active.dataset
    && active.value !== active.dataset.original) || view.draftRule || (view.selected && view.selected.kind === 'new' && view.draft);
}

function accept(snap, selection) {
  const before = view.selected;
  view.snap = snap;
  if (selection !== undefined) view.selected = selection;
  if (view.selected && view.selected.kind !== 'new' && !find(view.selected)) {
    view.selected = null;
  }
  if (!view.selected) {
    const first = visible()[0];
    view.selected = first ? { kind: first.kind, key: first.key } : null;
  }
  // A confirmation belongs to the word it was opened for, never the next one.
  if (!before || !view.selected || before.kind !== view.selected.kind || before.key !== view.selected.key) {
    view.confirming = false;
  }
  render();
}

let statusTimer = null;
function status(text) {
  clearTimeout(statusTimer);
  statusLine.textContent = text;
  if (text !== IDLE) statusTimer = setTimeout(() => { statusLine.textContent = IDLE; }, 3000);
}

/* Edits run one at a time in the order made, so a heard form typed while
   the boost is still saving is not lost. Where the selection lands after an
   edit is the edit's call, unless the user has already moved on. */
let queue = Promise.resolve();
function edit(op, selection, done) {
  const from = view.selected;
  queue = queue.then(() => run(op, view.selected === from ? selection : undefined, done));
  return queue;
}

async function run(op, selection, done) {
  view.saving = true;
  view.message = null;
  status('Saving…');
  try {
    const snap = await invoke('dictionary_edit', { edit: op });
    view.confirming = false;
    if (done) done();
    accept(snap, selection);
    status('Saved. Changes apply to your next dictation.');
  } catch (error) {
    view.confirming = false;
    status(IDLE);
    view.message = { text: String(error), error: true };
    await reload();
  } finally {
    view.saving = false;
  }
}

function neighbour() {
  const options = visible();
  const index = options.findIndex(o => view.selected && o.kind === view.selected.kind && o.key === view.selected.key);
  const next = options[index + 1] || options[index - 1];
  return next ? { kind: next.kind, key: next.key } : null;
}

function deleteWord(word) {
  edit({ op: 'delete', term: word.term }, neighbour());
}

function ignore(waiting) {
  edit({ op: 'ignore', term: waiting.term }, neighbour());
}

function startNew(prefill = '') {
  view.draft = prefill;
  select({ kind: 'new', key: '' });
}

function cancelNew() {
  view.draft = '';
  view.selected = null;
  view.message = null;
  accept(view.snap);
  list.focus();
}

async function reload() {
  try {
    const snap = await invoke('dictionary_load');
    view.stale = false;
    accept(snap);
  } catch (error) {
    view.message = { text: String(error), error: true };
    render();
  }
}

async function poll() {
  if (document.visibilityState === 'visible' && !view.snap) {
    await reload();
  } else if (document.visibilityState === 'visible' && !view.saving) {
    try {
      const stamp = await invoke('dictionary_stamp');
      if (stamp !== view.snap.stamp) view.stale = true;
      if (view.stale && !editing()) await reload();
    } catch (_) {}
  }
  setTimeout(poll, 1500);
}

function plus() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 12 12'); svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5'); svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M6 1.5v9M1.5 6h9');
  svg.append(path);
  return svg;
}

function minus() {
  const svg = plus();
  svg.firstChild.setAttribute('d', 'M1.5 6h9');
  return svg;
}

/* Selection is drawn in the accent color only while the list has focus in
   the active window, the way AppKit draws a source list. */
const paintFocus = () => list.classList.toggle('focused', document.hasFocus() && document.activeElement === list);
list.addEventListener('focus', paintFocus);
list.addEventListener('blur', paintFocus);
window.addEventListener('blur', paintFocus);
list.addEventListener('keydown', event => {
  const options = visible();
  if (!options.length) return;
  const index = options.findIndex(o => view.selected && o.kind === view.selected.kind && o.key === view.selected.key);
  const move = to => { const o = options[Math.max(0, Math.min(options.length - 1, to))]; select({ kind: o.kind, key: o.key }, { focusList: true }); };
  if (event.key === 'ArrowDown') { event.preventDefault(); move(index + 1); }
  else if (event.key === 'ArrowUp') { event.preventDefault(); move(index - 1); }
  else if (event.key === 'Home') { event.preventDefault(); move(0); }
  else if (event.key === 'End') { event.preventDefault(); move(options.length - 1); }
  else if (event.key === 'Enter') {
    event.preventDefault();
    const target = pane.querySelector('.title:not([readonly])') || pane.querySelector('.actions button');
    if (target) target.focus();
  } else if ((event.key === 'Backspace' || event.key === 'Delete') && view.selected && view.selected.kind === 'word') {
    event.preventDefault();
    view.confirming = true;
    renderDetail();
  }
});

search.addEventListener('input', () => {
  view.query = search.value;
  renderList();
});
search.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown') { event.preventDefault(); list.focus(); }
  if (event.key === 'Escape' && search.value) { event.preventDefault(); search.value = ''; view.query = ''; renderList(); }
});
document.getElementById('add').addEventListener('click', () => startNew(view.query.trim()));
document.getElementById('reveal').addEventListener('click', () => invoke('dictionary_reveal').catch(error => status(String(error))));
document.addEventListener('keydown', event => {
  if (event.metaKey && event.key === 'f') { event.preventDefault(); search.focus(); search.select(); }
  if (event.metaKey && event.key === 'n') { event.preventDefault(); startNew(view.query.trim()); }
});
window.addEventListener('focus', () => { paintFocus(); if (view.snap && !view.saving) invoke('dictionary_stamp').then(stamp => { if (stamp !== view.snap.stamp && !editing()) reload(); }).catch(() => {}); });

reload().then(() => { list.focus(); setTimeout(poll, 1500); });
</script>
</html>
