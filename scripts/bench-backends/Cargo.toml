[package]
name = "see-backend-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
parakeet-rs = { path = "../../src-tauri/vendor/parakeet-rs", features = ["coreml"] }
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }
hound = "3.5"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
