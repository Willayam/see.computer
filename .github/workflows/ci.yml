name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Compile native media test
        working-directory: .
        run: |
          mkdir -p .audit/native-media-test
          clang -fobjc-arc -Werror -Wno-nullability-completeness -Wno-incompatible-pointer-types \
            -mmacosx-version-min=14.0 scripts/test-recorder.m \
            -framework AVFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework Foundation -framework ScreenCaptureKit \
            -framework UniformTypeIdentifiers -framework VideoToolbox -framework AudioToolbox \
            -o .audit/native-media-test/test-recorder

  ios-core:
    name: iPhone engine builds from the shared sources
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/core
      - run: cargo fmt --check
      - run: cargo clippy --target aarch64-apple-ios -- -D warnings

      - name: Build the iOS keyboard for distribution
        working-directory: .
        run: |
          xcodebuild -project ios/SeeComputer.xcodeproj -target Keyboard -sdk iphonesimulator \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/ios-products" OBJROOT="$RUNNER_TEMP/ios-objects" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=STORE GCC_PREPROCESSOR_DEFINITIONS=STORE=1 build
      - name: Check draft ownership and bilingual typing
        working-directory: .
        run: |
          ios/scripts/test-draft.sh
          device=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$device" -b
          ios/scripts/test-typing.sh "$device"

  sharing:
    name: Sharing service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test services/shares/worker.test.mjs
