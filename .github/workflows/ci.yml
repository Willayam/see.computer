name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: TZ=Europe/Stockholm cargo test history::tests::repeated_hour_edits_the_selected_occurrence
      - name: Check recording, clipboard preservation and idle drawing
        working-directory: .
        run: |
          mkdir -p .audit/native-media-test
          clang -fobjc-arc -Werror -Wno-nullability-completeness -Wno-incompatible-pointer-types \
            -mmacosx-version-min=14.0 scripts/test-recorder.m \
            -framework AVFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework Foundation -framework ScreenCaptureKit \
            -framework UniformTypeIdentifiers -framework VideoToolbox -framework AudioToolbox \
            -o .audit/native-media-test/test-recorder
          mkdir -p .audit/native-media-test/{finish,cancel,fail}
          .audit/native-media-test/test-recorder .audit/native-media-test/finish
          .audit/native-media-test/test-recorder .audit/native-media-test/cancel cancel
          .audit/native-media-test/test-recorder .audit/native-media-test/fail fail
          clang -fobjc-arc -Werror -framework AppKit scripts/test-pasteboard.m -o .audit/native-media-test/test-pasteboard
          .audit/native-media-test/test-pasteboard
          swiftc -O scripts/test-pill.swift -o .audit/native-media-test/test-pill
          .audit/native-media-test/test-pill "$PWD/ui/pill.html"
          scripts/tests/library/run.sh

  ios-core:
    name: iPhone engine builds from the shared sources
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/core
      - run: cargo fmt --check
      - run: cargo clippy --target aarch64-apple-ios -- -D warnings

      - name: Link the distribution app, keyboard and Live Activity
        working-directory: .
        run: |
          xcodebuild -project ios/SeeComputer.xcodeproj -scheme see.computer -sdk iphonesimulator \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/see-ios" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=STORE GCC_PREPROCESSOR_DEFINITIONS=STORE=1 build
      - name: Check draft ownership and bilingual typing
        working-directory: .
        run: |
          ios/scripts/test-draft.sh
          ios/scripts/test-history.sh
          device=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$device" -b
          SWIPE_RUNTIME_ARTIFACTS="$RUNNER_TEMP/see-ios/SourcePackages/artifacts/swiperuntime" ios/scripts/test-typing.sh "$device"

  sharing:
    name: Sharing service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test services/shares
