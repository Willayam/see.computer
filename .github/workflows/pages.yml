name: Website

# Publishes site/ to the Cloudflare Pages project "see-computer", which serves
# https://see.computer. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the Cloudflare Pages: Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account id shown by `wrangler whoami`

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name see-computer --branch main
