[package]
name = "see-computer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local-first dictation and instant video links for the Mac."

[[bin]]
name = "see-computer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.18"
hound = "3"
arboard = { version = "3", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
dirs = "6"
url = "2"
libc = "0.2"
chrono = "0.4"
parakeet-rs = "0.3.7"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
