      const inPupil = Math.abs(u - 0.5) < EYE.pupil / 2;
      if (inPupil) env *= 0.12;
      v = v * (1 - EYE.envelope) + (0.3 + 0.7 * v) * env * EYE.envelope;
      if (inPupil) alpha = 1;
      if (blink) v = 0;
    }
    const bh = lineTh + v * (maxH - lineTh) * open;
    if (bh <= lineTh + 0.4) continue;
    fill(ctx, x0 + i * (bw + gap), cy - bh / 2, bw, bh, Math.min(bw / 2, 2),
         alpha * (0.45 + 0.55 * Math.min(1, v * 1.4)), accent);
  }
  if (rec && !blink && open > 0.7) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.25 * recPulse(t, EYE.pulseHz)})`;
    const pw = Math.max(2, EYE.pupil * innerW * 0.3);
    ctx.beginPath(); ctx.roundRect(cx - pw / 2, cy - lineTh, pw, lineTh * 2, lineTh); ctx.fill();
  }
}
const STUDIES = [
{ id: 'ref', label: 'Hex lifecycle (reference)', blurb: 'dot → pill → smaller pill',
  draw(ctx, cx, cy, t, d, st, store, dt) {
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(d.sc, d.sc); ctx.translate(-cx, -cy);
    ctx.globalAlpha = Math.min(1, d.sc);
    if (st === 'armed') hexCapsule(ctx, cx, cy, 16, 16, BLACKC, 0.08, 0);
    else if (st === 'listen') hexCapsule(ctx, cx, cy, d.w, 16, d.warn ? AMBER : RED, d.avg, d.peak);
    else if (st === 'record') hexCapsule(ctx, cx, cy, d.w, 16, RED, Math.max(d.avg, 0.3 * recPulse(t)), d.peak);
    else if (st === 'transcribe' || st === 'save') hexCapsule(ctx, cx, cy, d.w, 16, BLUE, 0.3, 0.1, t);
    ctx.restore();
  } },
{ id: 'bloom', label: 'Bloom chip', blurb: 'speech blooms it, silence wilts it',
  draw(ctx, cx, cy, t, d, st, store, dt) {
    ctx.save(); ctx.globalAlpha = Math.min(1, d.sc);
    drawBloom(ctx, cx, cy, t, d, st, store, dt,
      (c, x, y, w, h, r, a, accent) => { c.fillStyle = css(accent, a);
        c.save(); c.shadowColor = css(accent); c.shadowBlur = 6;
        c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); c.restore(); },
      (s, wilted) => wilted ? AMBER : s === 'record' ? hexRgb('#ff3b30') : hexRgb('#50c8f5'));
    ctx.restore();
  } },
{ id: 'mbloom', label: 'Liquid metal bloom', blurb: 'same shape, molten content', metal: true,
  draw(ctx, cx, cy, t, d, st, store, dt) {
    /* crossfade between palette keys so state changes melt */
    const wilted = (st === 'listen' || st === 'record') && silentFor > 1.2;
    const want = metalKey(DEFAULT_PM, st, wilted);
    store.key ??= want; store.mix ??= 1;
    if (want !== store.key) { store.prev = store.key; store.key = want; store.mix = 0; }
    store.mix = Math.min(1, store.mix + dt * 3);
    const open = store.open ? Math.max(0, store.open.x) : 0;
    const W = 10 + (EYE.w - 10) * open, H = 10 + (EYE.h - 10) * open;
    ctx.save(); ctx.globalAlpha = Math.min(1, d.sc);
    drawBloom(ctx, cx, cy, t, d, st, store, dt,
      (c, x, y, w, h, r, a) => {
        c.save(); c.beginPath(); c.roundRect(x, y, w, h, r); c.clip();
        const rx = cx - W / 2 + 4, ry = cy - H / 2 + 3, rw = Math.max(8, W - 8), rh = Math.max(6, H - 6);
        if (store.mix < 1 && store.prev) {
          c.globalAlpha *= Math.min(1, a + 0.2);
          metalFillKey(c, store.prev, rx, ry, rw, rh);
          c.globalAlpha *= store.mix;
        } else c.globalAlpha *= Math.min(1, a + 0.2);
        metalFillKey(c, store.key, rx, ry, rw, rh);
        c.restore();
      },
      (s, w2) => w2 ? AMBER : s === 'record' ? hexRgb('#ff3b30') : hexRgb('#dedede'));
    ctx.restore();
  } },
{ id: 'aperture', label: 'Naked aperture', blurb: 'no shell — the sound is the shape',
  draw(ctx, cx, cy, t, d, st, store, dt) {
    if (st === 'hidden' && d.sc < 0.03) return;
    ctx.save(); ctx.globalAlpha = Math.min(1, d.sc);
    const innerW = 84, n = EYE.bars, gap = 2;
    const bw = Math.max(1.5, (innerW - (n - 1) * gap) / n), x0 = cx - innerW / 2, lineTh = 2.5;
    const wilted = (st === 'listen' || st === 'record') && silentFor > 1.2;
    const accent = wilted ? AMBER : st === 'record' ? hexRgb('#ff3b30') : hexRgb('#50c8f5');
    const bar = (x, y, w, h, r, a) => {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
      ctx.fillStyle = css(accent, a);
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
      ctx.shadowColor = css(accent, 0.8); ctx.shadowBlur = 5; ctx.shadowOffsetY = 0;
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
      ctx.restore();
    };
    if (st === 'armed') { bar(cx - 7, cy - lineTh / 2, 14, lineTh, lineTh / 2, 0.85); ctx.restore(); return; }
    bar(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, wilted ? 0.6 : 0.45);
    if (st === 'transcribe' || st === 'save') {
      const speed = st === 'save' ? 2.6 : 1.1;
      for (let i = 0; i < n; i++) {
        const u = i / (n - 1);
        const wv = Math.max(0, Math.sin((u - t * speed) * Math.PI * 2)) * 0.5;
        if (wv < 0.05) continue;
        bar(x0 + i * (bw + gap), cy - (lineTh + wv * 8) / 2, bw, lineTh + wv * 8, bw / 2, 0.35 + wv);
      }
      ctx.restore(); return;
    }
    if (wilted) {
      const p = (t * 0.55) % 1, hx = x0 + p * innerW;
      const g = ctx.createLinearGradient(hx - 20, 0, hx + 20, 0);
      g.addColorStop(0, 'rgba(255,179,64,0)'); g.addColorStop(0.5, 'rgba(255,179,64,1)'); g.addColorStop(1, 'rgba(255,179,64,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(x0, cy - lineTh / 2 - 0.5, innerW, lineTh + 1, lineTh / 2); ctx.fill();
      ctx.restore(); return;
    }
    if (st === 'listen' || st === 'record') {
      const rec = st === 'record';
      const bands = balancedBands(n, EYE.gain, EYE.tilt, EYE.mirror);
      const blink = rec && ((t + 0.9) % EYE.blinkEvery) < 0.14;
      for (let i = 0; i < n; i++) {
        const u = i / (n - 1);
        let v = bands[i], alpha = 0.9;
        if (rec) {
          let env = Math.pow(Math.sin(Math.PI * u), 0.8);
          const inPupil = Math.abs(u - 0.5) < EYE.pupil / 2;
          if (inPupil) env *= 0.12;
          v = v * (1 - EYE.envelope) + (0.3 + 0.7 * v) * env * EYE.envelope;
          if (inPupil) alpha = 1;
          if (blink) v = 0;
        }
        const bh = lineTh + v * 20;
        if (bh <= lineTh + 0.4) continue;
        bar(x0 + i * (bw + gap), cy - bh / 2, bw, bh, Math.min(bw / 2, 2), alpha * (0.45 + 0.55 * Math.min(1, v * 1.4)));
      }
      if (rec && !blink) {
        ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.25 * recPulse(t, EYE.pulseHz)})`;
        const pw = Math.max(2, EYE.pupil * innerW * 0.3);
        ctx.beginPath(); ctx.roundRect(cx - pw / 2, cy - lineTh, pw, lineTh * 2, lineTh); ctx.fill();
      }
    }
    ctx.restore();
  } },
];
/* ================= sequencer ================= */
const SEQ = {
  dictation: [['hidden', 900], ['armed', 500], ['listen', 4600], ['transcribe', 1300], ['hidden', 1400]],
  video: [['hidden', 900], ['armed', 500], ['record', 5600], ['save', 1100], ['hidden', 1400]],
};
let seqMode = 'dictation', seqI = 0, seqStart = performance.now();
function tickSeq(now) {
  const seq = SEQ[seqMode];
  if (now - seqStart >= seq[seqI][1]) { seqStart = now; seqI = (seqI + 1) % seq.length; }
  return seq[seqI][0];
}
/* ================= DOM setup ================= */
const studiesDiv = document.getElementById('studies');
const studyCtx = [];
for (const s of STUDIES) {
  const wrap = document.createElement('div'); wrap.className = 'study';
  const c = document.createElement('canvas'); c.width = 560; c.height = 168;
  const cap = document.createElement('div'); cap.className = 'cap';
  cap.innerHTML = `<b>${s.label}</b><br><span class="st">${s.blurb}</span>`;
  wrap.appendChild(c); wrap.appendChild(cap); studiesDiv.appendChild(wrap);
  studyCtx.push(c.getContext('2d'));
}
const studyStores = STUDIES.map(() => ({}));
const matrixDiv = document.getElementById('matrix');
const hdr = document.createElement('div'); hdr.className = 'hdr';
for (const [, label] of STATES) { const d = document.createElement('div'); d.textContent = label; hdr.appendChild(d); }
matrixDiv.appendChild(hdr);
const rowCtx = [];
for (const v of VARIANTS) {
  const row = document.createElement('div'); row.className = 'mrow';
  const lab = document.createElement('label'); lab.textContent = v.label;
  const c = document.createElement('canvas'); c.width = 1800; c.height = 96;
  row.appendChild(lab); row.appendChild(c); matrixDiv.appendChild(row);
  rowCtx.push(c.getContext('2d'));
}
const colStores = STATES.map(() => ({}));
const cellStores = VARIANTS.map(() => STATES.map(() => ({})));
const seqStore = {};   /* drive store shared by lifecycle studies */
/* ================= main loop ================= */
const seqlbl = document.getElementById('seqlbl');
let last = performance.now(), lblAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  sample(t, dt);
  metalRenderAll(dt);
  /* lifecycle studies */
  const seqSt = tickSeq(now);
  if (now > lblAt) { seqlbl.textContent = STATES.find(x => x[0] === seqSt)[1]; lblAt = now + 150; }
  const dSeq = drive2(seqStore, seqSt, dt);
  for (let i = 0; i < STUDIES.length; i++) {
    const ctx = studyCtx[i];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 560, 168);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    try { STUDIES[i].draw(ctx, 140, 44, t, dSeq, seqSt, studyStores[i], dt); }
    catch (e) { document.title = 'ERR ' + e; }
  }
  /* matrix: one drive per state column, shared by every row */
  const colD = STATES.map(([st], c) => drive2(colStores[c], st, dt));
  for (let r = 0; r < VARIANTS.length; r++) {
    const v = VARIANTS[r], ctx = rowCtx[r];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1800, 96);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    for (let c = 0; c < STATES.length; c++) {
      const st = STATES[c][0], d = colD[c];
      if (d.sc < 0.02) continue;
      const cx = 150 * c + 75, cy = 24;
      ctx.save();
      if (v.noScale) ctx.globalAlpha = Math.min(1, d.sc);
      else {
        ctx.translate(cx, cy); ctx.scale(d.sc, d.sc); ctx.translate(-cx, -cy);
        ctx.globalAlpha = Math.min(1, d.sc);
      }
      try { v.draw(ctx, cx, cy, t, d, st, cellStores[r][c]); }
      catch (e) { document.title = 'ERR ' + e; }
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ================= controls ================= */
document.getElementById('controls').onclick = async (e) => {
  const b = e.target;
  if (b.dataset.v) {
    if (b.dataset.v === 'mic' && !micAnalyser) { try { await enableMic(); } catch { return; } }
    voice = b.dataset.v;
    document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.bg) {
    document.body.className = b.dataset.bg + (b.dataset.bg !== 'light' ? '' : '');
    document.body.classList.toggle('darkbar', b.dataset.bg !== 'light');
    document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.seq) {
    seqMode = b.dataset.seq; seqI = 0; seqStart = performance.now();
    document.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b));
  }
