function makeSpring(K, C, v0) { return { x: v0, v: 0, K, C }; }

    const f1 = fLo * Math.pow(fHi / fLo, (b + 1) / N_BANDS);
    const i0 = Math.max(0, Math.floor(f0 / nyq * bins));
    const i1 = Math.min(bins - 1, Math.max(i0 + 1, Math.ceil(f1 / nyq * bins)));

const gauss = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
function fakeBands(t) {

  for (let b = 0; b < N_BANDS; b++) {
    const x = b / (N_BANDS - 1);
    const shape = 0.45 * Math.exp(-x * 2.4)

  for (let j = 0; j < n; j++) {

  const avg = Math.min(1, stepSpring(store.m, active ? raw.avg : 0, dt) * 3);

  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }

/* ================= liquid metal engine (metal-fx port, effect 1) ================= */
const GLW = 416, GLH = 128;
const glcv = document.createElement('canvas'); glcv.width = GLW; glcv.height = GLH;
const gl = glcv.getContext('webgl', { preserveDrawingBuffer: true });

const FRAG = `
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_color1; uniform vec3 u_color2; uniform vec3 u_color3;
uniform vec3 u_color4; uniform vec3 u_color5;
uniform float u_intensity; uniform float u_scale; uniform float u_direction;

vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;

float fbm(vec2 p, float oct){

        loader 'pulse' | 'shine' | 'sweep' | 'dots' | 'fill'
        dot {px, gap} | undefined              LED-grid content instead of bars */
function bloomGeom(store, st, dt, cfg) {
  const talking = raw.avg > TUNE.thresh;
  const listening = st === 'listen' || st === 'record';
  store.pres ??= 0;
  store.pres += ((listening && talking ? 1 : 0) - store.pres) * Math.min(1, dt * (talking ? 7 : TUNE.wilt));
  store.open ??= makeSpring(K_BOUNCY, C_BOUNCY, 0);
  const K = Math.pow(2 * Math.PI / TUNE.resp, 2);
  store.open.K = K; store.open.C = 2 * TUNE.damp * Math.sqrt(K);
  const ot = st === 'hidden' ? 0
    : st === 'armed' ? (cfg.armedOpen ?? 0.1)
    : listening ? cfg.floor + (1 - cfg.floor) * store.pres
    : (cfg.loadOpen ?? 0.32);
  return Math.max(0, stepSpring(store.open, ot, dt));
}
function drawBloomV(ctx, cx, cy, t, d, st, store, dt, cfg) {
  const open = bloomGeom(store, st, dt, cfg);
  if (open < 0.02) return;
  const active = st === 'listen' || st === 'record';
  const wilted = active && silentFor > 1.2;
  const W = cfg.minW + (cfg.maxW - cfg.minW) * open;
  const H = cfg.minH + (cfg.maxH - cfg.minH) * open;
  const accent = wilted ? cfg.colors.warn : st === 'record' ? cfg.colors.record : cfg.colors.listen;
  if (cfg.fillMode === 'metal') {
    const want = metalKey(DEFAULT_PM, st, wilted);
    store.key ??= want; store.mix ??= 1;
    if (want !== store.key) { store.prev = store.key; store.key = want; store.mix = 0; }
    store.mix = Math.min(1, store.mix + dt * 3);
  }
  const rr = Math.min(12, H / 2);
  /* --- shell --- */
  if (cfg.shellMode !== false) {
    if (cfg.shellMode === 'tint') {
      const bg = mixc(mixc(accent, BLACKC, 0.55), accent, active ? d.avg : 0.08);
      ctx.save();
      ctx.shadowColor = css(accent, active ? Math.max(0.15, d.avg) : 0.15); ctx.shadowBlur = 6;
      ctx.fillStyle = css(bg);
      ctx.beginPath(); ctx.roundRect(cx - W / 2, cy - H / 2, W, H, rr); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = css(mixc(accent, WHITE, 0.1), 0.5); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(cx - W / 2, cy - H / 2, W, H, rr); ctx.stroke();
    } else bodyShell(ctx, cx, cy, W, H, rr);
  }
  /* --- fill primitive --- */
  const metalRegion = [cx - W / 2 + 4, cy - H / 2 + 3, Math.max(8, W - 8), Math.max(6, H - 6)];
  const fill = (x, y, w, h, r, a) => {
    if (cfg.fillMode === 'metal') {
      ctx.save(); ctx.globalAlpha *= Math.min(1, a + 0.2);
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
      if (store.mix < 1 && store.prev) {
        metalFillKey(ctx, store.prev, ...metalRegion);
        ctx.globalAlpha *= store.mix;
      }
      metalFillKey(ctx, store.key, ...metalRegion);
      ctx.restore();
      return;
    }
    const col = cfg.fillMode === 'white' ? [240, 242, 248] : accent;
    ctx.save();
    if (cfg.shellMode === false) {
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
      ctx.fillStyle = css(col, a);
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
      ctx.shadowOffsetY = 0;
    }
    ctx.shadowColor = css(col, 0.8); ctx.shadowBlur = 5;
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
    ctx.restore();
  };
  const pad = Math.max(4, 10 * open), innerW = Math.max(6, W - pad * 2), maxBarH = H - 10;
  const x0 = cx - innerW / 2, lineTh = 2.5;
  /* --- still (nearly) a dot: a quiet ember --- */
  if (open < 0.3) {
    fill(cx - 2.5, cy - 2.5, 5, 5, 2.5, 0.5 + d.avg * 0.5);
    return;
  }
  /* --- LED dot-grid content --- */
  if (cfg.dot) {
    drawDots(ctx, cx, cy, t, d, st, store, cfg, { innerW, maxBarH, accent, wilted, fill });
    return;
  }
  /* --- baseline --- */
  fill(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, wilted ? 0.55 : 0.4);
  /* --- loaders --- */
  if (st === 'transcribe' || st === 'save') {
    const speed = st === 'save' ? 2.4 : 1.0;
    drawLoader(cfg.loader, ctx, t, speed, { x0, innerW, cy, lineTh, maxBarH, accent, fill });
    return;
  }
  /* --- deaf: amber glint travels the line --- */
  if (wilted) {
    const p = (t * 0.55) % 1, hx = x0 + p * innerW;
    const g = ctx.createLinearGradient(hx - 20, 0, hx + 20, 0);
    g.addColorStop(0, css(accent, 0)); g.addColorStop(0.5, css(accent, 1)); g.addColorStop(1, css(accent, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x0, cy - lineTh / 2 - 0.5, innerW, lineTh + 1, lineTh / 2); ctx.fill();
    return;
  }
  /* --- listening / recording bars --- */
  const n = Math.max(5, Math.min(21, 1 + 2 * Math.floor(innerW / 9)));
  const gap = 2, bw = Math.max(1.5, (innerW - (n - 1) * gap) / n);
  const rec = st === 'record';
  const bands = balancedBands(n, EYE.gain, EYE.tilt, EYE.mirror);
  const blink = rec && ((t + 0.9) % EYE.blinkEvery) < 0.14;
  for (let i = 0; i < n; i++) {
    const u = n === 1 ? 0.5 : i / (n - 1);
    let v = bands[i], alpha = 0.9;
    if (rec) { const e = eyeShape(v, u, blink); v = e.v; if (e.inPupil) alpha = 1; }
    const bh = lineTh + v * (maxBarH - lineTh) * open;
    if (bh <= lineTh + 0.4) continue;
    fill(x0 + i * (bw + gap), cy - bh / 2, bw, bh, Math.min(bw / 2, 2),
         alpha * (0.45 + 0.55 * Math.min(1, v * 1.4)));
  }
  if (rec && !blink && open > 0.7) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.25 * recPulse(t, EYE.pulseHz)})`;
    const pw = Math.max(2, EYE.pupil * innerW * 0.3);
    ctx.beginPath(); ctx.roundRect(cx - pw / 2, cy - lineTh, pw, lineTh * 2, lineTh); ctx.fill();
  }
}
/* ================= loaders (transcribe / save treatments) ================= */
function drawLoader(kind, ctx, t, speed, o) {
  const { x0, innerW, cy, lineTh, maxBarH, accent, fill } = o;
  if (kind === 'pulse') {
    const n = Math.max(5, Math.min(21, 1 + 2 * Math.floor(innerW / 9)));
    const gap = 2, bw = Math.max(1.5, (innerW - (n - 1) * gap) / n);
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      const wv = Math.max(0, Math.sin((u - t * speed) * Math.PI * 2)) * 0.5;
      if (wv < 0.05) continue;
      const bh = lineTh + wv * maxBarH * 0.4;
      fill(x0 + i * (bw + gap), cy - bh / 2, bw, bh, bw / 2, 0.35 + wv);
    }
  } else if (kind === 'shine') {
    const p = ((t * speed * 0.7) % 1);
    const hx = x0 - 15 + p * (innerW + 30);
    const g = ctx.createLinearGradient(hx - 12, 0, hx + 12, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save(); ctx.beginPath(); ctx.roundRect(x0, cy - lineTh / 2 - 0.5, innerW, lineTh + 1, lineTh / 2); ctx.clip();
    ctx.fillStyle = g; ctx.fillRect(x0, cy - lineTh / 2 - 0.5, innerW, lineTh + 1); ctx.restore();
  } else if (kind === 'sweep') {
    const tri = Math.abs(((t * speed * 0.9) % 2) - 1);
    const sx = x0 + tri * (innerW - 10);
    fill(sx, cy - lineTh, 10, lineTh * 2, lineTh, 0.95);
  } else if (kind === 'dots') {
    for (let i = -1; i <= 1; i++) {
      const ph = Math.max(0, Math.sin(t * speed * 4 - i * 0.9));
      fill(x0 + innerW / 2 + i * 9 - 2, cy - 2 - ph * 2.5, 4, 4, 2, 0.3 + 0.7 * ph);
    }
  } else if (kind === 'fill') {
    const p = (t * speed * 0.8) % 1;
    fill(x0, cy - lineTh / 2, innerW * p, lineTh, lineTh / 2, 0.95);
  }
}
/* ================= LED dot-grid content ================= */
function drawDots(ctx, cx, cy, t, d, st, store, cfg, o) {
  const { innerW, maxBarH, accent, wilted } = o;
  const px = cfg.dot.px, gp = cfg.dot.gap, pitch = px + gp;
  let cols = Math.floor(innerW / pitch); if (cols % 2 === 0) cols -= 1; cols = Math.max(5, cols);
  let rows = Math.floor(maxBarH / pitch); if (rows % 2 === 0) rows -= 1; rows = Math.max(3, rows);
  const gx0 = cx - (cols * pitch - gp) / 2 + px / 2, gy0 = cy - (rows * pitch - gp) / 2 + px / 2;
  const mid = (rows - 1) / 2;
  const dotAt = (c, r, a, col) => {
    ctx.save();
    if (a > 0.5) { ctx.shadowColor = css(col, 0.9); ctx.shadowBlur = 4; }
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.arc(gx0 + c * pitch, gy0 + r * pitch, px / 2, 0, 7); ctx.fill();
    ctx.restore();
  };
  const rec = st === 'record';
  if (st === 'transcribe' || st === 'save') {
    const speed = st === 'save' ? 2.4 : 1.0;
    const tri = Math.abs(((t * speed * 0.9) % 2) - 1);
    const scanC = Math.round(tri * (cols - 1));
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const dd = Math.abs(c - scanC);
      const a = r === mid && dd === 0 ? 0.95 : dd === 0 ? 0.55 : r === mid ? 0.25 : 0.07;
      dotAt(c, r, a, accent);
    }
    return;
  }
  if (wilted) {
    const p = (t * 0.55) % 1, hot = Math.round(p * (cols - 1));
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const dd = Math.abs(c - hot);
      const a = r === mid ? (dd === 0 ? 1 : dd === 1 ? 0.45 : 0.25) : 0.06;
      dotAt(c, r, a, accent);
    }
    return;
  }
  const bands = balancedBands(cols, EYE.gain, EYE.tilt, EYE.mirror);
  const blink = rec && ((t + 0.9) % EYE.blinkEvery) < 0.14;
  for (let c = 0; c < cols; c++) {
    const u = cols === 1 ? 0.5 : c / (cols - 1);
    let v = bands[c], pupilCol = false;
    if (rec) { const e = eyeShape(v, u, blink); v = e.v; pupilCol = e.inPupil; }
    const lit = Math.round(v * rows);
    for (let r = 0; r < rows; r++) {
      const on = Math.abs(r - mid) <= lit / 2;
      let a = on ? 0.4 + 0.6 * Math.min(1, v * 1.3) : r === mid ? 0.28 : 0.07;
      let col = accent;
      if (rec && pupilCol && r === mid && !blink) { col = WHITE; a = 0.55 + 0.35 * recPulse(t, EYE.pulseHz); }
      dotAt(c, r, a, col);
    }
  }
}
/* ================= rows ================= */
const CY = [80, 200, 245], BLU = [10, 132, 255], GRN = [58, 255, 112], WHT = [240, 242, 248];
const BASE = { minW: 10, minH: 10, maxW: 104, maxH: 30, floor: 0.24, loadOpen: 0.32,
               colors: { listen: CY, record: RED, warn: AMBER }, fillMode: 'solid', shellMode: 'dark', loader: 'pulse' };
const ROWS = [
  { label: 'Full bloom', sub: 'cyan · pulse loader', cfg: { ...BASE } },
  { label: 'Subtle bloom', sub: 'floor 0.5 · shine loader', cfg: { ...BASE, minW: 28, minH: 12, maxW: 76, maxH: 24, floor: 0.5, loadOpen: 0.4, loader: 'shine' } },
  { label: 'Tiny bloom', sub: 'Hex-tinted shell · sweep', cfg: { ...BASE, minW: 8, minH: 8, maxW: 60, maxH: 17, floor: 0.35, loadOpen: 0.55, shellMode: 'tint', fillMode: 'white', loader: 'sweep', colors: { listen: RED, record: RED, warn: AMBER } } },
  { label: 'Monochrome', sub: 'white bars · ellipsis loader', cfg: { ...BASE, colors: { listen: WHT, record: RED, warn: AMBER }, loader: 'dots' } },
  { label: 'Amber VFD', sub: 'phosphor amber · fill loader', cfg: { ...BASE, colors: { listen: AMBER, record: RED, warn: [255, 120, 40] }, loader: 'fill' } },
  { label: 'System blue', sub: 'macOS accent · pulse', cfg: { ...BASE, colors: { listen: BLU, record: RED, warn: AMBER } } },
  { label: 'Liquid metal', sub: 'silver → molten · pulse', cfg: { ...BASE, fillMode: 'metal' } },
  { label: 'Dot display', sub: 'LED 3px · scan loader', cfg: { ...BASE, dot: { px: 3, gap: 1.8 }, loadOpen: 0.5 } },
  { label: 'Dot display', sub: 'phosphor green · dense', cfg: { ...BASE, maxW: 92, maxH: 27, dot: { px: 2.3, gap: 1.4 }, loadOpen: 0.5, colors: { listen: GRN, record: RED, warn: AMBER } } },
  { label: 'Naked bloom', sub: 'no shell · pulse', cfg: { ...BASE, shellMode: false } },
];
/* ================= sequencer ================= */
const SEQ = {
  dictation: [['hidden', 900], ['armed', 500], ['listen', 4600], ['transcribe', 1300], ['hidden', 1400]],
  video: [['hidden', 900], ['armed', 500], ['record', 5600], ['save', 1100], ['hidden', 1400]],
};
let seqMode = 'dictation', seqI = 0, seqStart = performance.now();
function tickSeq(now) {
  const seq = SEQ[seqMode];
  if (now - seqStart >= seq[seqI][1]) { seqStart = now; seqI = (seqI + 1) % seq.length; }
  return seq[seqI][0];
}
/* ================= DOM ================= */
const COLS = [['loop', 'Loop ▶'], ...STATES];
const matrixDiv = document.getElementById('matrix');
const hdr = document.createElement('div'); hdr.className = 'hdr';
for (const [, label] of COLS) { const el = document.createElement('div'); el.textContent = label; hdr.appendChild(el); }
matrixDiv.appendChild(hdr);
const rowCtx = [];
for (const r of ROWS) {
  const row = document.createElement('div'); row.className = 'mrow';
  const lab = document.createElement('label'); lab.innerHTML = `${r.label}<br><small>${r.sub}</small>`;
  const c = document.createElement('canvas'); c.width = 2100; c.height = 96;
  row.appendChild(lab); row.appendChild(c); matrixDiv.appendChild(row);
  rowCtx.push(c.getContext('2d'));
}
const cellStores = ROWS.map(() => COLS.map(() => ({})));
const cellDrives = ROWS.map(() => COLS.map(() => ({})));
/* ================= main loop ================= */
const seqlbl = document.getElementById('seqlbl');
let last = performance.now(), lblAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  sample(t, dt);
  metalRenderAll(dt);
  const seqSt = tickSeq(now);
  if (now > lblAt) { seqlbl.textContent = STATES.find(x => x[0] === seqSt)[1]; lblAt = now + 150; }
  for (let r = 0; r < ROWS.length; r++) {
    const ctx = rowCtx[r];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 2100, 96);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    for (let c = 0; c < COLS.length; c++) {
      const st = COLS[c][0] === 'loop' ? seqSt : COLS[c][0];
      const d = drive2(cellDrives[r][c], st, dt);
      const cx = 150 * c + 75, cy = 24;
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.sc);
      try { drawBloomV(ctx, cx, cy, t, d, st, cellStores[r][c], dt, ROWS[r].cfg); }
      catch (e) { document.title = 'ERR ' + e; }
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ================= controls ================= */
document.getElementById('controls').onclick = async (e) => {
  const b = e.target;
  if (b.dataset.v) {
    if (b.dataset.v === 'mic' && !micAnalyser) { try { await enableMic(); } catch { return; } }
    voice = b.dataset.v;
    document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.bg) {
    document.body.className = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.seq) {
    seqMode = b.dataset.seq; seqI = 0; seqStart = performance.now();
    document.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b));
  }
};
for (const [id, key, fmt] of [['sResp', 'resp', v => v.toFixed(2)], ['sDamp', 'damp', v => v.toFixed(2)],
                              ['sWilt', 'wilt', v => v.toFixed(2)], ['sThresh', 'thresh', v => v.toFixed(3)]]) {
  const el = document.getElementById(id), out = document.getElementById('v' + id.slice(1));
  el.oninput = () => { TUNE[key] = +el.value; out.textContent = fmt(+el.value); };
}
</script>
