/* ================= springs (stable, SwiftUI-equivalent) ================= */
function makeSpring(K, C, v0) { return { x: v0, v: 0, K, C }; }
function stepSpring(s, target, dt) {
  const h = 1 / 240; let r = Math.min(dt, 0.1);

  while (r > 0) { const st = Math.min(h, r);

}

  return { avg: Math.min(1, Math.sqrt(sum / micData.length) * 6), peak: Math.min(1, peak * 3) };

function fakeLevel(t) {
  const phrase = (t % 7); let env = 0;
  if (phrase < 4.4) env = Math.max(0.06, Math.max(0, Math.sin(t * 7.3) * 0.6 + Math.sin(t * 13.1) * 0.4) * (0.55 + 0.45 * Math.sin(t * 1.1)));

/* live frequency bands: 24 log-spaced buckets 85 Hz..8 kHz, fast attack slow release */

function micBands() {

    const i1 = Math.min(bins - 1, Math.max(i0 + 1, Math.ceil(f1 / nyq * bins)));

  const env = fakeLevel(t).avg;

  const c2 = 0.38 + 0.13 * Math.sin(t * 0.9 + 1.2);
  const c3 = 0.62 + 0.1 * Math.sin(t * 1.3 + 2.4);
  const out = new Array(N_BANDS);
  for (let b = 0; b < N_BANDS; b++) {
    const x = b / (N_BANDS - 1);
    const shape = 0.45 * Math.exp(-x * 2.4)
      + 0.9 * gauss(x, c1, 0.07) + 0.7 * gauss(x, c2, 0.1) + 0.35 * gauss(x, c3, 0.09);

function tickBands(t, dt, active) {

    const tv = target ? target[b] : 0;
    if (tv > bandState[b]) bandState[b] += (tv - bandState[b]) * Math.min(1, dt * 28);

function bandsFor(n, gain = 1) {
  const out = new Array(n);

    const a = Math.floor(i / n * N_BANDS), z = Math.max(a + 1, Math.ceil((i + 1) / n * N_BANDS));
    let m = 0;
    for (let j = a; j < z; j++) m = Math.max(m, bandState[j]);

  const base = bandsFor(n, gain);

  if (!mirror) return comp;
  const out = new Array(n);
  const mid = (n - 1) / 2;
  for (let j = 0; j < n; j++) {
    const u = Math.abs(j - mid) / mid;

  ['transcribe', 'Transcribing'],
  ['record', 'Video recording'],
  ['save', 'Saving clip'],

const S = {
  m: makeSpring(K_METER, C_METER, 0), p: makeSpring(K_METER, C_METER, 0),
  sc: makeSpring(K_BOUNCY, C_BOUNCY, 1), w: makeSpring(K_BOUNCY, C_BOUNCY, 56),
  sampleAt: 0, mT: 0, pT: 0, silentFor: 0, t0: performance.now(), c: {},
  lastSampleT: 0,

const RED = [255, 59, 48], BLUE = [10, 132, 255], CYAN = [80, 200, 245], AMBER = [255, 179, 64],

function mixc(a, b, f) { f = Math.max(0, Math.min(1, f));
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ================= liquid metal engine (port of Jakubantalik/metal-fx, effect 1 "Plasma") =================

const glcv = document.createElement('canvas'); glcv.width = GLW; glcv.height = GLH;

let metalOK = false, uni = {};
const FRAG = `
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_color1; uniform vec3 u_color2; uniform vec3 u_color3;
uniform vec3 u_color4; uniform vec3 u_color5;
uniform float u_intensity; uniform float u_scale; uniform float u_direction;
uniform float u_distortion; uniform float u_complexity; uniform float u_blur;
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;

float fbm(vec2 p, float oct){

    p *= 2.0; a *= 0.5;

}
float nfbm(vec2 p){ return fbm(p, 3.0 + u_complexity * 4.0); }
vec3 palette(float t){

  float w3 = exp(-k * (t - 0.5)  * (t - 0.5));
  float w4 = exp(-k * (t - 0.75) * (t - 0.75));

  float freq = 3.0 + cpx * 8.0;

function runSeq(btn, otherBtn, seq, labelRun, labelStop) {
