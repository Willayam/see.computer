/* ---------- render loop ---------- */

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const d = drive(t, dt);
  ctx2.setTransform(1, 0, 0, 1, 0, 0); ctx2.clearRect(0, 0, 640, 180);
  ctx2.setTransform(2, 0, 0, 2, 0, 0);
  if (d.sc > 0.02) {
    ctx2.save();
    ctx2.translate(160, 26); ctx2.scale(d.sc, d.sc); ctx2.translate(-160, -26);
    ctx2.globalAlpha = Math.max(0, Math.min(1, d.sc));
    if (d.sc < 0.97 && ctx2.filter !== undefined) ctx2.filter = `blur(${((1 - d.sc) * 4).toFixed(1)}px)`;
    try { current.draw(ctx2, 160, 26, t, d); } catch (e) { document.title = 'ERR ' + e; }

    ctx2.restore();
