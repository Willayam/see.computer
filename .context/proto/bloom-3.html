<body class="light">

  <label>bounce <input type="range" id="sDamp" min="0.45" max="1" step="0.01" value="0.7"><span class="val" id="vDamp">0.70</span></label>
  <label>wilt speed <input type="range" id="sWilt" min="0.15" max="2.5" step="0.05" value="0.5"><span class="val" id="vWilt">0.50</span></label>

<script>
'use strict';
/* ================= springs ================= */
function makeSpring(K, C, v0) { return { x: v0, v: 0, K, C }; }
function stepSpring(s, target, dt) {
  const h = 1 / 240; let r = Math.min(dt, 0.1);
  if (!isFinite(s.x) || !isFinite(s.v)) { s.x = target; s.v = 0; }
  while (r > 0) { const st = Math.min(h, r);
    s.v += (s.K * (target - s.x) - s.C * s.v) * st; s.x += s.v * st; r -= st; }
  return s.x;
}
const K_METER = Math.pow(2 * Math.PI / 0.15, 2), C_METER = 2 * 0.86 * Math.sqrt(K_METER);
const K_BOUNCY = Math.pow(2 * Math.PI / 0.3, 2), C_BOUNCY = 2 * 0.70 * Math.sqrt(K_BOUNCY);
const TUNE = { resp: 0.3, damp: 0.7, wilt: 0.5, thresh: 0.05 };
/* ================= audio ================= */
let micAnalyser = null, micData = null, voice = 'fake';
let micFreq = null, micSampleRate = 48000;
async function enableMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ac = new AudioContext(); const src = ac.createMediaStreamSource(stream);
  micSampleRate = ac.sampleRate;
  micAnalyser = ac.createAnalyser(); micAnalyser.fftSize = 1024;
  micAnalyser.smoothingTimeConstant = 0.5;
  src.connect(micAnalyser);
  micData = new Float32Array(micAnalyser.fftSize);
  micFreq = new Float32Array(micAnalyser.frequencyBinCount);
}
function micLevel() {
  micAnalyser.getFloatTimeDomainData(micData);
  let sum = 0, peak = 0;
  for (const v of micData) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
  return { avg: Math.min(1, Math.sqrt(sum / micData.length) * 6), peak: Math.min(1, peak * 3) };
}
function fakeLevel(t) {
  const phrase = (t % 7); let env = 0;
  if (phrase < 4.4) env = Math.max(0.06, Math.max(0, Math.sin(t * 7.3) * 0.6 + Math.sin(t * 13.1) * 0.4) * (0.55 + 0.45 * Math.sin(t * 1.1)));
  else if (phrase < 4.9) env = 0.03;
  else if (phrase < 6.2) env = Math.max(0.05, Math.abs(Math.sin(t * 9.7)) * 0.7);
  else env = 0.02;
  const level = Math.min(1, env * (0.85 + 0.3 * Math.sin(t * 31)));
  return { avg: level, peak: Math.min(1, level * 1.5 + 0.08 * Math.abs(Math.sin(t * 47))) };
}
const N_BANDS = 24;
function micBands() {
  micAnalyser.getFloatFrequencyData(micFreq);
  const nyq = micSampleRate / 2, bins = micFreq.length;
  const fLo = 85, fHi = 8000, out = new Array(N_BANDS).fill(0);
  for (let b = 0; b < N_BANDS; b++) {
    const f0 = fLo * Math.pow(fHi / fLo, b / N_BANDS);
    const f1 = fLo * Math.pow(fHi / fLo, (b + 1) / N_BANDS);
    const i0 = Math.max(0, Math.floor(f0 / nyq * bins));
    const i1 = Math.min(bins - 1, Math.max(i0 + 1, Math.ceil(f1 / nyq * bins)));
    let sum = 0;
    for (let i = i0; i < i1; i++) sum += micFreq[i];
    const db = sum / (i1 - i0);
    out[b] = Math.pow(Math.max(0, Math.min(1, (db + 78) / 48)), 1.4);
  }
  return out;
}
const gauss = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
function fakeBands(t) {
  const env = fakeLevel(t).avg;
  const c1 = 0.14 + 0.06 * Math.sin(t * 1.7);
  const c2 = 0.38 + 0.13 * Math.sin(t * 0.9 + 1.2);
  const c3 = 0.62 + 0.1 * Math.sin(t * 1.3 + 2.4);
  const out = new Array(N_BANDS);
  for (let b = 0; b < N_BANDS; b++) {
    const x = b / (N_BANDS - 1);
    const shape = 0.45 * Math.exp(-x * 2.4)
      + 0.9 * gauss(x, c1, 0.07) + 0.7 * gauss(x, c2, 0.1) + 0.35 * gauss(x, c3, 0.09);
    const wobble = 0.72 + 0.28 * Math.sin(t * 12 + b * 2.3);
    out[b] = Math.min(1, env * shape * wobble * 1.5);
  }
  return out;
}
const bandState = new Float32Array(N_BANDS);
function tickBands(t, dt) {
  const target = voice === 'silent' ? null
    : voice === 'mic' && micAnalyser ? micBands() : fakeBands(t);
  for (let b = 0; b < N_BANDS; b++) {
    const tv = target ? target[b] : 0;
    if (tv > bandState[b]) bandState[b] += (tv - bandState[b]) * Math.min(1, dt * 28);
    else bandState[b] += (tv - bandState[b]) * Math.min(1, dt * 6);
  }
}
function bandsFor(n, gain = 1) {
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i / n * N_BANDS), z = Math.max(a + 1, Math.ceil((i + 1) / n * N_BANDS));
    let m = 0;
    for (let j = a; j < z; j++) m = Math.max(m, bandState[j]);
    out[i] = Math.min(1, m * gain);
  }
  return out;
}
function balancedBands(n, gain, tilt, mirror) {
  const base = bandsFor(n, gain);
  const comp = base.map((v, i) => Math.min(1, v * (0.7 + tilt * (i / Math.max(1, n - 1)))));
  if (!mirror) return comp;
  const out = new Array(n);
  const mid = (n - 1) / 2;
  for (let j = 0; j < n; j++) {
    const u = Math.abs(j - mid) / mid;
    out[j] = comp[Math.min(n - 1, Math.round(u * (n - 1)))];
  }
  return out;
}
/* ================= signal ================= */
const STATES = [
  ['hidden', 'Hidden'], ['armed', 'Armed'], ['listen', 'Dictating'],
  ['transcribe', 'Transcribing'], ['record', 'Recording'], ['save', 'Saving'],
];
let raw = { avg: 0, peak: 0 }, sampleAt = 0, silentFor = 0, lastSampleT = 0;
function sample(t, dt) {
  if (t >= sampleAt) {
    raw = voice === 'silent' ? { avg: 0.004, peak: 0.006 }
      : voice === 'mic' && micAnalyser ? micLevel() : fakeLevel(t);
    sampleAt = t + 0.1;
    if (raw.avg < 0.045) silentFor += Math.max(0, t - lastSampleT); else silentFor = 0;
    lastSampleT = t;
  }
  tickBands(t, dt);
}
function drive2(store, st, dt) {
  store.m ??= makeSpring(K_METER, C_METER, 0);
  store.sc ??= makeSpring(K_BOUNCY, C_BOUNCY, 0);
  const active = st === 'listen' || st === 'record';
  const avg = Math.min(1, stepSpring(store.m, active ? raw.avg : 0, dt) * 3);
  const sc = stepSpring(store.sc, st === 'hidden' ? 0 : 1, dt);
  return { avg, sc: Math.max(0, sc), warn: silentFor > 1.2 && active };
}
const recPulse = (t, hz = 0.9) => 0.55 + 0.45 * Math.sin(t * Math.PI * 2 * hz);
const RED = [255, 59, 48], CYAN = [80, 200, 245], AMBER = [255, 179, 64], WHT = [240, 242, 248];
function mixc(a, b, f) { f = Math.max(0, Math.min(1, f));
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function bodyShell(ctx, cx, cy, w, h, r) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(13,14,18,0.97)';
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.stroke();
}
const EYE = { gain: 1.5, tilt: 1.6, mirror: true, blinkEvery: 3.6, pulseHz: 0.9, envelope: 0.8 };
const bellEnv = u => Math.pow(Math.sin(Math.PI * u), 0.8);
/* ================= geometry ================= */
function geom(store, st, dt, cfg) {
  const talking = raw.avg > TUNE.thresh;
  const listening = st === 'listen' || st === 'record';
  store.pres ??= 0;
  store.pres += ((listening && talking ? 1 : 0) - store.pres) * Math.min(1, dt * (talking ? 7 : TUNE.wilt));
  store.sw ??= makeSpring(K_BOUNCY, C_BOUNCY, cfg.armedDims.w);
  store.sh ??= makeSpring(K_BOUNCY, C_BOUNCY, cfg.armedDims.h);
  const K = Math.pow(2 * Math.PI / TUNE.resp, 2), C = 2 * TUNE.damp * Math.sqrt(K);
  store.sw.K = K; store.sw.C = C; store.sh.K = K; store.sh.C = C;
  let tw, th;
  if (listening) {
    tw = cfg.restDims.w + (cfg.fullDims.w - cfg.restDims.w) * store.pres;
    th = cfg.restDims.h + (cfg.fullDims.h - cfg.restDims.h) * store.pres;
  } else if (st === 'transcribe' || st === 'save') { tw = cfg.loadDims.w; th = cfg.loadDims.h; }
  else { tw = cfg.armedDims.w; th = cfg.armedDims.h; }
  return { W: Math.max(4, stepSpring(store.sw, tw, dt)), H: Math.max(4, stepSpring(store.sh, th, dt)) };
}
/* ================= draw ================= */
function drawBloom3(ctx, cx, cy, t, d, st, store, dt, cfg) {
  const { W, H } = geom(store, st, dt, cfg);
  const active = st === 'listen' || st === 'record';
  const wilted = active && silentFor > 1.2;
  const accent = wilted ? AMBER : st === 'record' ? RED : (cfg.listenCol || CYAN);
  const rr = Math.min(W, H) / 2;
  if (st === 'record') store.recT0 ??= t; else store.recT0 = undefined;
  bodyShell(ctx, cx, cy, W, H, rr);
  const fill = (x, y, w, h, r, a, colOv) => {
    const col = colOv || (cfg.fillMode === 'white' && st !== 'record' && !wilted ? WHT : accent);
    ctx.save();
    ctx.shadowColor = css(col, 0.8); ctx.shadowBlur = 5;
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
    ctx.restore();
  };
  const dotAt = (x, y, pr, a, col) => {
    ctx.save();
    if (a > 0.5) { ctx.shadowColor = css(col, 0.9); ctx.shadowBlur = 4; }
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.fill();
    ctx.restore();
  };
  const pad = Math.min(10, Math.max(4, W * 0.1)), innerW = Math.max(6, W - pad * 2);
  const maxBarH = H - 10, x0 = cx - innerW / 2, lineTh = 2.5;
  /* --- armed / hidden: the resting pixel --- */
  if (st === 'armed' || st === 'hidden') {
    const px = cfg.dot ? cfg.dot.px : 4.4;
    const breath = 0.5 + 0.5 * Math.sin(t * 1.8);
    if (cfg.rest === 'plus' && cfg.dot) {
      const pitch = cfg.dot.px + cfg.dot.gap;
      dotAt(cx, cy, px / 2, 0.3 + 0.08 * breath, accent);
      for (const [gx, gy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
        dotAt(cx + gx * pitch, cy + gy * pitch, px / 2, 0.08 + 0.04 * breath, accent);
    } else if (cfg.rest === 'bare1' && cfg.dot) {
      dotAt(cx, cy, px / 2, 0.28 + 0.1 * breath, accent);
    } else if (cfg.dot) {
      /* bloom1: one almost-dark pixel with a soft bloom so it sits balanced */
      const g = ctx.createRadialGradient(cx, cy, 0.3, cx, cy, 5.5);
      g.addColorStop(0, css(accent, 0.1 + 0.08 * breath)); g.addColorStop(1, css(accent, 0));
      ctx.fillStyle = g; ctx.fillRect(cx - 6, cy - 6, 12, 12);
      dotAt(cx, cy, px / 2, 0.3 + 0.12 * breath, accent);
    } else {
      fill(cx - 2.2, cy - 2.2, 4.4, 4.4, 2.2, 0.45 + 0.2 * Math.sin(t * 2.2));
    }
    return;
  }
  /* --- loading --- */
  if (st === 'transcribe' || st === 'save') {
    const speed = st === 'save' ? 2.4 : 1.0;
    const col = cfg.fillMode === 'white' ? WHT : accent;
    if (cfg.dot && cfg.loader === 'scan') {
      /* small centered grid with air around it, masked to a circle */
      const px = cfg.dot.px;
      const size = Math.min(W, H) - 11, n = 5;
      const pitch2 = size / (n - 1), g0 = -size / 2;
      const tri = Math.abs(((t * speed * 0.9) % 2) - 1);
      const scanC = Math.round(tri * (n - 1));
      for (let gr = 0; gr < n; gr++) for (let gc = 0; gc < n; gc++) {
        const x = g0 + gc * pitch2, y = g0 + gr * pitch2;
        if (Math.hypot(x, y) > size / 2 * 1.2) continue;
        const dd = Math.abs(gc - scanC);
        dotAt(cx + x, cy + y, px / 2, dd === 0 ? 0.9 : dd === 1 ? 0.32 : 0.07, col);
      }
      return;

      /* dot-orbit: a small free-standing circle of dots with room to breathe —
         no background grid, ring radius well inside the shell */
      const px = cfg.dot.px, pitch = px + cfg.dot.gap;
      const R = Math.max(4, Math.min(W, H) / 2 - 5.5);
      const K = Math.max(6, Math.min(12, Math.round(Math.PI * 2 * R / pitch)));
      const head = t * speed * 4;
      for (let i = 0; i < K; i++) {
        const ang = (i / K) * Math.PI * 2;
        let da = (head - ang) % (Math.PI * 2);
        if (da < 0) da += Math.PI * 2;
        const a = 0.1 + 0.85 * Math.pow(1 - da / (Math.PI * 2), 2.5);
        dotAt(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R, px / 2, a, col);
      }
      dotAt(cx, cy, px / 2, 0.15, col);   /* the ember anchor stays home */
      return;
    }
    /* smooth orbit: glowy multi-dot comet (the pulse loader's light, in a circle) */
    const r = Math.max(3, Math.min(W, H) / 2 - 5);
    const dR = Math.max(1.5, r * 0.3);
    ctx.save();
    ctx.strokeStyle = css(col, 0.12); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    const th = t * speed * 4;
    for (let i = 2; i >= 0; i--) {
      const ang = th - i * 0.55;
      const a = [0.95, 0.5, 0.24][i], sz = dR * [1, 0.8, 0.62][i];
      ctx.shadowColor = css(col, 0.9); ctx.shadowBlur = 7;
      ctx.fillStyle = css(col, a);
      ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, sz, 0, 7); ctx.fill();

    ctx.restore();

  if (cfg.dot) {
    const px = cfg.dot.px, gp = cfg.dot.gap, pitch = px + gp;
    let cols = Math.floor(innerW / pitch); if (cols % 2 === 0) cols -= 1; cols = Math.max(5, cols);
    let rows = Math.floor(maxBarH / pitch); if (rows % 2 === 0) rows -= 1; rows = Math.max(3, rows);

      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        const dd = Math.abs(c - hot);
        const a = r === mid ? (dd === 0 ? 1 : dd === 1 ? 0.45 : 0.25) : 0.06;
        dotAt(gx0 + c * pitch, gy0 + r * pitch, px / 2, a, accent);

      return;

    const rec = st === 'record';
    const bands = balancedBands(cols, EYE.gain, EYE.tilt, EYE.mirror);
    for (let c = 0; c < cols; c++) {
      const u = cols === 1 ? 0.5 : c / (cols - 1);
      let v = bands[c];
      if (rec && cfg.recStyle === 'bellpx')
        v = v * (1 - EYE.envelope) + (0.3 + 0.7 * v) * bellEnv(u) * EYE.envelope;
      const lit = Math.round(v * rows);
      for (let r = 0; r < rows; r++) {
        const on = Math.abs(r - mid) <= lit / 2;
        const a = on ? 0.4 + 0.6 * Math.min(1, v * 1.3) : r === mid ? 0.28 : 0.07;
        dotAt(gx0 + c * pitch, gy0 + r * pitch, px / 2, a, accent);
      }
    }
    if (rec && cfg.recStyle === 'blinkpx') {
      const on = (t % 1.1) < 0.55;
      dotAt(gx0 + midc * pitch, gy0 + mid * pitch, px / 2 + 0.3, on ? 1 : 0.12, RED);
    } else if (rec && cfg.recStyle === 'pulsepx') {
      dotAt(gx0 + midc * pitch, gy0 + mid * pitch, px / 2 + 0.3, 0.45 + 0.55 * recPulse(t, EYE.pulseHz), RED);
    }

  }
  /* --- bars listening / recording --- */
  fill(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, wilted ? 0.55 : 0.4);
  if (wilted) {
    const p = (t * 0.55) % 1, hx = x0 + p * innerW;
    const g = ctx.createLinearGradient(hx - 20, 0, hx + 20, 0);
    g.addColorStop(0, css(accent, 0)); g.addColorStop(0.5, css(accent, 1)); g.addColorStop(1, css(accent, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x0, cy - lineTh / 2 - 0.5, innerW, lineTh + 1, lineTh / 2); ctx.fill();
    return;
  }
  const rec = st === 'record';
  const n = Math.max(5, Math.min(21, 1 + 2 * Math.floor(innerW / 9)));
  const gap = 2, bw = Math.max(1.5, (innerW - (n - 1) * gap) / n);
  const bands = balancedBands(n, EYE.gain, EYE.tilt, EYE.mirror);
  for (let i = 0; i < n; i++) {
    const u = n === 1 ? 0.5 : i / (n - 1);
    let v = bands[i];
    if (rec && cfg.recStyle === 'bell')
      v = v * (1 - EYE.envelope) + (0.3 + 0.7 * v) * bellEnv(u) * EYE.envelope;
    const bh = lineTh + v * (maxBarH - lineTh);
    if (bh <= lineTh + 0.4) continue;
    fill(x0 + i * (bw + gap), cy - bh / 2, bw, bh, Math.min(bw / 2, 2),

  if (rec) {
    if (cfg.recStyle === 'centerdot') {
      dotAt(cx, cy, 2.2, 0.55 + 0.45 * recPulse(t, EYE.pulseHz), RED);
    } else if (cfg.recStyle === 'recdot') {
      dotAt(x0 + 2.5, cy, 2, 0.5 + 0.5 * recPulse(t, EYE.pulseHz), RED);
    } else if (cfg.recStyle === 'shell') {
      ctx.save();
      ctx.strokeStyle = css(RED, 0.35 + 0.45 * recPulse(t, EYE.pulseHz));
      ctx.lineWidth = 1.5;
      ctx.shadowColor = css(RED, 0.7); ctx.shadowBlur = 7;
      ctx.beginPath(); ctx.roundRect(cx - W / 2, cy - H / 2, W, H, rr); ctx.stroke();
      ctx.restore();
    } else if (cfg.recStyle === 'timer') {
      const frac = ((t - (store.recT0 ?? t)) % 60) / 60;
      ctx.fillStyle = css(RED, 0.3);
      ctx.fillRect(x0, cy - H / 2 + 3.5, innerW, 1.4);
      ctx.fillStyle = css(RED, 0.85);
      ctx.fillRect(x0, cy - H / 2 + 3.5, innerW * frac, 1.4);
    }
  }
}
/* ================= rows ================= */
const SUBTLE = { restDims: { w: 46, h: 19 }, fullDims: { w: 76, h: 24 } };
const CIRCLE_ARMED = { w: 14, h: 14 };
const DOTCFG = { ...SUBTLE, fullDims: { w: 76, h: 26 }, armedDims: { w: 18, h: 18 }, dot: { px: 2.6, gap: 1.6 } };
const ROWS = [
  { label: 'Dots · bloom pixel', sub: 'orbit 28 · rec: all red',
    cfg: { ...DOTCFG, rest: 'bloom1', loadDims: { w: 28, h: 28 }, recStyle: 'plainpx' } },
  { label: 'Dots · bloom pixel', sub: 'orbit 22 (smaller) · rec: blinking LED',
    cfg: { ...DOTCFG, rest: 'bloom1', loadDims: { w: 22, h: 22 }, recStyle: 'blinkpx' } },
  { label: 'Dots · plus rest', sub: 'orbit 22 · rec: red bell shape',
    cfg: { ...DOTCFG, rest: 'plus', loadDims: { w: 22, h: 22 }, recStyle: 'bellpx' } },
  { label: 'Dots · bare pixel', sub: 'circular scan 24 · rec: pulsing center',
    cfg: { ...DOTCFG, rest: 'bare1', loader: 'scan', loadDims: { w: 24, h: 24 }, recStyle: 'pulsepx' } },
  { label: 'Bars · orbit 20', sub: 'rec: plain red spectrum',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 20, h: 20 }, loader: 'orbit', recStyle: 'plain' } },
  { label: 'Bars · orbit 16', sub: 'smaller · rec: center red dot',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 16, h: 16 }, loader: 'orbit', recStyle: 'centerdot' } },
  { label: 'Bars · orbit + ember', sub: 'rec: REC dot at left',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 20, h: 20 }, loader: 'orbitember', recStyle: 'recdot' } },
  { label: 'Bars · orbit 20', sub: 'rec: pulsing red shell',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 20, h: 20 }, loader: 'orbit', recStyle: 'shell' } },
  { label: 'Bars · orbit 20', sub: 'rec: bell shape (no pupil)',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 20, h: 20 }, loader: 'orbit', recStyle: 'bell' } },
  { label: 'Bars · orbit 20', sub: 'rec: timer line + red bars',
    cfg: { ...SUBTLE, armedDims: CIRCLE_ARMED, loadDims: { w: 20, h: 20 }, loader: 'orbit', recStyle: 'timer' } },
];
/* ================= sequencer ================= */
const SEQ = {
  dictation: [['hidden', 900], ['armed', 500], ['listen', 4600], ['transcribe', 1300], ['hidden', 1400]],
  video: [['hidden', 900], ['armed', 500], ['record', 5600], ['save', 1100], ['hidden', 1400]],
};
let seqMode = 'dictation', seqI = 0, seqStart = performance.now();
function tickSeq(now) {
  const seq = SEQ[seqMode];
  if (now - seqStart >= seq[seqI][1]) { seqStart = now; seqI = (seqI + 1) % seq.length; }
  return seq[seqI][0];
}
/* ================= DOM ================= */
const COLS = [['loop', 'Loop ▶'], ...STATES];
const matrixDiv = document.getElementById('matrix');
const hdr = document.createElement('div'); hdr.className = 'hdr';
for (const [, label] of COLS) { const el = document.createElement('div'); el.textContent = label; hdr.appendChild(el); }
matrixDiv.appendChild(hdr);
const rowCtx = [];
for (const r of ROWS) {
  const row = document.createElement('div'); row.className = 'mrow';
  const lab = document.createElement('label'); lab.innerHTML = `${r.label}<br><small>${r.sub}</small>`;
  const c = document.createElement('canvas'); c.width = 2100; c.height = 96;
  row.appendChild(lab); row.appendChild(c); matrixDiv.appendChild(row);
  rowCtx.push(c.getContext('2d'));
}
const cellStores = ROWS.map(() => COLS.map(() => ({})));
const cellDrives = ROWS.map(() => COLS.map(() => ({})));
/* ================= main loop ================= */
const seqlbl = document.getElementById('seqlbl');
let last = performance.now(), lblAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  sample(t, dt);
  const seqSt = tickSeq(now);
  if (now > lblAt) { seqlbl.textContent = STATES.find(x => x[0] === seqSt)[1]; lblAt = now + 150; }
  for (let r = 0; r < ROWS.length; r++) {
    const ctx = rowCtx[r];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 2100, 96);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    for (let c = 0; c < COLS.length; c++) {
      const st = COLS[c][0] === 'loop' ? seqSt : COLS[c][0];
      const d = drive2(cellDrives[r][c], st, dt);
      if (d.sc < 0.02) continue;
      const cx = 150 * c + 75, cy = 24;
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.sc);
      try { drawBloom3(ctx, cx, cy, t, d, st, cellStores[r][c], dt, ROWS[r].cfg); }
      catch (e) { document.title = 'ERR ' + e; }
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ================= controls ================= */
document.getElementById('controls').onclick = async (e) => {
  const b = e.target;
  if (b.dataset.v) {
    if (b.dataset.v === 'mic' && !micAnalyser) { try { await enableMic(); } catch { return; } }
    voice = b.dataset.v;
    document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.bg) {
    document.body.className = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.seq) {
    seqMode = b.dataset.seq; seqI = 0; seqStart = performance.now();
    document.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b));
  }
};
for (const [id, key, fmt] of [['sResp', 'resp', v => v.toFixed(2)], ['sDamp', 'damp', v => v.toFixed(2)],
                              ['sWilt', 'wilt', v => v.toFixed(2)], ['sThresh', 'thresh', v => v.toFixed(3)]]) {
  const el = document.getElementById(id), out = document.getElementById('v' + id.slice(1));
  el.oninput = () => { TUNE[key] = +el.value; out.textContent = fmt(+el.value); };
}
</script>
