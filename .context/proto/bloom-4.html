<script>
'use strict';
/* ================= springs ================= */
function makeSpring(K, C, v0) { return { x: v0, v: 0, K, C }; }
function stepSpring(s, target, dt) {
  const h = 1 / 240; let r = Math.min(dt, 0.1);
  if (!isFinite(s.x) || !isFinite(s.v)) { s.x = target; s.v = 0; }
  while (r > 0) { const st = Math.min(h, r);
    s.v += (s.K * (target - s.x) - s.C * s.v) * st; s.x += s.v * st; r -= st; }
  return s.x;
}
const K_METER = Math.pow(2 * Math.PI / 0.15, 2), C_METER = 2 * 0.86 * Math.sqrt(K_METER);
const K_BOUNCY = Math.pow(2 * Math.PI / 0.3, 2), C_BOUNCY = 2 * 0.70 * Math.sqrt(K_BOUNCY);
const TUNE = { resp: 0.3, damp: 0.7, wilt: 0.5, thresh: 0.05, load: 1.5 };
/* ================= audio ================= */
let micAnalyser = null, micData = null, voice = 'fake';
let micFreq = null, micSampleRate = 48000;
async function enableMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ac = new AudioContext(); const src = ac.createMediaStreamSource(stream);
  micSampleRate = ac.sampleRate;
  micAnalyser = ac.createAnalyser(); micAnalyser.fftSize = 1024;
  micAnalyser.smoothingTimeConstant = 0.5;
  src.connect(micAnalyser);
  micData = new Float32Array(micAnalyser.fftSize);
  micFreq = new Float32Array(micAnalyser.frequencyBinCount);
}
function micLevel() {
  micAnalyser.getFloatTimeDomainData(micData);
  let sum = 0, peak = 0;
  for (const v of micData) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
  return { avg: Math.min(1, Math.sqrt(sum / micData.length) * 6), peak: Math.min(1, peak * 3) };
}
function fakeLevel(t) {
  const phrase = (t % 7); let env = 0;
  if (phrase < 4.4) env = Math.max(0.06, Math.max(0, Math.sin(t * 7.3) * 0.6 + Math.sin(t * 13.1) * 0.4) * (0.55 + 0.45 * Math.sin(t * 1.1)));
  else if (phrase < 4.9) env = 0.03;
  else if (phrase < 6.2) env = Math.max(0.05, Math.abs(Math.sin(t * 9.7)) * 0.7);
  else env = 0.02;
  const level = Math.min(1, env * (0.85 + 0.3 * Math.sin(t * 31)));

const N_BANDS = 24;
function micBands() {
  micAnalyser.getFloatFrequencyData(micFreq);
  const nyq = micSampleRate / 2, bins = micFreq.length;
  const fLo = 85, fHi = 8000, out = new Array(N_BANDS).fill(0);
  for (let b = 0; b < N_BANDS; b++) {
    const f0 = fLo * Math.pow(fHi / fLo, b / N_BANDS);
    const f1 = fLo * Math.pow(fHi / fLo, (b + 1) / N_BANDS);
    const i0 = Math.max(0, Math.floor(f0 / nyq * bins));
    const i1 = Math.min(bins - 1, Math.max(i0 + 1, Math.ceil(f1 / nyq * bins)));
    let sum = 0;
    for (let i = i0; i < i1; i++) sum += micFreq[i];

  }

}
const gauss = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
function fakeBands(t) {
  const env = fakeLevel(t).avg;
  const c1 = 0.14 + 0.06 * Math.sin(t * 1.7);
  const c2 = 0.38 + 0.13 * Math.sin(t * 0.9 + 1.2);
  const c3 = 0.62 + 0.1 * Math.sin(t * 1.3 + 2.4);
  const out = new Array(N_BANDS);
  for (let b = 0; b < N_BANDS; b++) {
    const x = b / (N_BANDS - 1);
    const shape = 0.45 * Math.exp(-x * 2.4)
      + 0.9 * gauss(x, c1, 0.07) + 0.7 * gauss(x, c2, 0.1) + 0.35 * gauss(x, c3, 0.09);
    const wobble = 0.72 + 0.28 * Math.sin(t * 12 + b * 2.3);
    out[b] = Math.min(1, env * shape * wobble * 1.5);

}
const bandState = new Float32Array(N_BANDS);
function tickBands(t, dt) {
  const target = voice === 'silent' ? null
    : voice === 'mic' && micAnalyser ? micBands() : fakeBands(t);
  for (let b = 0; b < N_BANDS; b++) {
    const tv = target ? target[b] : 0;
    if (tv > bandState[b]) bandState[b] += (tv - bandState[b]) * Math.min(1, dt * 28);
    else bandState[b] += (tv - bandState[b]) * Math.min(1, dt * 6);
  }
}
function bandsFor(n, gain = 1) {
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i / n * N_BANDS), z = Math.max(a + 1, Math.ceil((i + 1) / n * N_BANDS));
    let m = 0;
    for (let j = a; j < z; j++) m = Math.max(m, bandState[j]);
    out[i] = Math.min(1, m * gain);

}
function balancedBands(n, gain, tilt, mirror) {
  const base = bandsFor(n, gain);
  const comp = base.map((v, i) => Math.min(1, v * (0.7 + tilt * (i / Math.max(1, n - 1)))));
  if (!mirror) return comp;
  const out = new Array(n);
  const mid = (n - 1) / 2;
  for (let j = 0; j < n; j++) {
    const u = Math.abs(j - mid) / mid;
    out[j] = comp[Math.min(n - 1, Math.round(u * (n - 1)))];

}
/* ================= signal ================= */
const STATES = [
  ['hidden', 'Hidden'], ['armed', 'Armed'], ['listen', 'Dictating'],
  ['transcribe', 'Transcribing'], ['record', 'Recording'], ['save', 'Saving'],

let raw = { avg: 0, peak: 0 }, sampleAt = 0, silentFor = 0, lastSampleT = 0;
function sample(t, dt) {
  if (t >= sampleAt) {

    sampleAt = t + 0.1;

    lastSampleT = t;

  tickBands(t, dt);
}
function drive2(store, st, dt) {
  store.m ??= makeSpring(K_METER, C_METER, 0);
  store.sc ??= makeSpring(K_BOUNCY, C_BOUNCY, 0);
  const active = st === 'listen' || st === 'record';
  const avg = Math.min(1, stepSpring(store.m, active ? raw.avg : 0, dt) * 3);
  const sc = stepSpring(store.sc, st === 'hidden' ? 0 : 1, dt);
  return { avg, sc: Math.max(0, sc), warn: silentFor > 1.2 && active };
}
const recPulse = (t, hz = 0.9) => 0.55 + 0.45 * Math.sin(t * Math.PI * 2 * hz);
const RED = [255, 59, 48], CYAN = [80, 200, 245], AMBER = [255, 179, 64];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function bodyShell(ctx, cx, cy, w, h, r) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(13,14,18,0.97)';
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, r); ctx.stroke();
}
const EYE = { gain: 1.5, tilt: 1.6, mirror: true, pulseHz: 0.9 };
/* ================= geometry =================
   Load morphs run on a snappier spring (resp × loadSnap) so the shape change
   and the loader read as one gesture. */
function geom(store, st, dt, cfg) {
  const talking = raw.avg > TUNE.thresh;
  const listening = st === 'listen' || st === 'record';
  const loading = st === 'transcribe' || st === 'save';
  store.pres ??= 0;
  store.pres += ((listening && talking ? 1 : 0) - store.pres) * Math.min(1, dt * (talking ? 7 : TUNE.wilt));
  store.sw ??= makeSpring(K_BOUNCY, C_BOUNCY, cfg.armedDims.w);
  store.sh ??= makeSpring(K_BOUNCY, C_BOUNCY, cfg.armedDims.h);
  const resp = TUNE.resp * (loading ? 0.72 : 1);
  const K = Math.pow(2 * Math.PI / resp, 2), C = 2 * TUNE.damp * Math.sqrt(K);
  store.sw.K = K; store.sw.C = C; store.sh.K = K; store.sh.C = C;
  let tw, th;
  if (listening) {
    tw = cfg.restDims.w + (cfg.fullDims.w - cfg.restDims.w) * store.pres;
    th = cfg.restDims.h + (cfg.fullDims.h - cfg.restDims.h) * store.pres;
  } else if (loading) { tw = cfg.loadDims.w; th = cfg.loadDims.h; }
  else { tw = cfg.armedDims.w; th = cfg.armedDims.h; }
  return { W: Math.max(4, stepSpring(store.sw, tw, dt)), H: Math.max(4, stepSpring(store.sh, th, dt)) };
}
/* ================= draw ================= */
function drawBloom4(ctx, cx, cy, t, d, st, store, dt, cfg) {
  const { W, H } = geom(store, st, dt, cfg);
  const active = st === 'listen' || st === 'record';
  const wilted = active && silentFor > 1.2;
  const accent = wilted ? AMBER : st === 'record' ? RED : CYAN;
  const rr = Math.min(W, H) / 2;
  bodyShell(ctx, cx, cy, W, H, rr);
  const fill = (x, y, w, h, r, a, col = accent) => {
    ctx.save();
    ctx.shadowColor = css(col, 0.8); ctx.shadowBlur = 5;
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
    ctx.restore();
  };
  const glowDot = (x, y, pr, a, col = accent, blur = 7) => {
    ctx.save();
    ctx.shadowColor = css(col, 0.9); ctx.shadowBlur = blur;
    ctx.fillStyle = css(col, a);
    ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.fill();
    ctx.restore();

  const maxBarH = H - 10, x0 = cx - innerW / 2, lineTh = 2.5;

    fill(cx - 2.2, cy - 2.2, 4.4, 4.4, 2.2, 0.45 + 0.2 * Math.sin(t * 2.2));
    return;

  if (st === 'transcribe' || st === 'save') {
    const speed = (st === 'save' ? 1.7 : 1) * TUNE.load;
    const kind = cfg.loader;
    if (kind === 'pulse') {
      /* the original bloomy traveling wave, in a compact pill */
      fill(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, 0.35);
      const n = Math.max(5, Math.min(21, 1 + 2 * Math.floor(innerW / 9)));
      const gap = 2, bw = Math.max(1.5, (innerW - (n - 1) * gap) / n);
      for (let i = 0; i < n; i++) {
        const u = i / (n - 1);
        const wv = Math.max(0, Math.sin((u - t * speed) * Math.PI * 2)) * 0.5;
        if (wv < 0.05) continue;
        const bh = lineTh + wv * maxBarH * 0.55;
        fill(x0 + i * (bw + gap), cy - bh / 2, bw, bh, bw / 2, 0.35 + wv);

    if (kind === 'shimmer') {

      fill(x0, cy - lineTh / 2, innerW, lineTh, lineTh / 2, 0.35);
      const p = (t * speed * 0.9) % 1, hx = x0 + p * innerW;
      const g = ctx.createLinearGradient(hx - 16, 0, hx + 16, 0);
      g.addColorStop(0, css(accent, 0)); g.addColorStop(0.5, css(accent, 1)); g.addColorStop(1, css(accent, 0));
      ctx.save();

      ctx.fillStyle = g;

      ctx.restore();

        glowDot(cx + i * 8.5, cy - ph * 2, 1.9 + ph * 0.5, 0.3 + 0.7 * ph);

    if (kind === 'breathe') {

      const p = 0.5 + 0.5 * Math.sin(t * speed * Math.PI * 1.6);

      g.addColorStop(0, css(accent, 0.55 + 0.35 * p)); g.addColorStop(1, css(accent, 0));

      ctx.lineWidth = 1.6;

}
const cellStores = ROWS.map(() => COLS.map(() => ({})));
const cellDrives = ROWS.map(() => COLS.map(() => ({})));
/* ================= main loop ================= */
const seqlbl = document.getElementById('seqlbl');
let last = performance.now(), lblAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  sample(t, dt);
  const seqSt = tickSeq(now);
  if (now > lblAt) { seqlbl.textContent = STATES.find(x => x[0] === seqSt)[1]; lblAt = now + 150; }
  for (let r = 0; r < ROWS.length; r++) {
    const ctx = rowCtx[r];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 2100, 96);
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    for (let c = 0; c < COLS.length; c++) {
      const st = COLS[c][0] === 'loop' ? seqSt : COLS[c][0];
      const d = drive2(cellDrives[r][c], st, dt);
      if (d.sc < 0.02) continue;
      const cx = 150 * c + 75, cy = 24;
      const mul = ROWS[r].cfg.speedMul || 1;
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.sc);
      try { drawBloom4(ctx, cx, cy, t * mul, d, st, cellStores[r][c], dt, ROWS[r].cfg); }
      catch (e) { document.title = 'ERR ' + e; }
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ================= controls ================= */
document.getElementById('controls').onclick = async (e) => {
  const b = e.target;
  if (b.dataset.v) {
    if (b.dataset.v === 'mic' && !micAnalyser) { try { await enableMic(); } catch { return; } }
    voice = b.dataset.v;
    document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.bg) {
    document.body.className = b.dataset.bg;
    document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x === b));
  } else if (b.dataset.seq) {
    seqMode = b.dataset.seq; seqI = 0; seqStart = performance.now();
    document.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b));
  }
};
for (const [id, key, fmt] of [['sResp', 'resp', v => v.toFixed(2)], ['sDamp', 'damp', v => v.toFixed(2)],
                              ['sWilt', 'wilt', v => v.toFixed(2)], ['sLoad', 'load', v => v.toFixed(2)]]) {
  const el = document.getElementById(id), out = document.getElementById('v' + id.slice(1));
  el.oninput = () => { TUNE[key] = +el.value; out.textContent = fmt(+el.value); };
}
</script>
